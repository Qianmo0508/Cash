<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>合租事故 · Co-habitation Incident</title>
<style>
:root{
  --ink:#2B3138; --ink2:#5F6975; --ink3:#9AA2AC;
  --gold:#B99A5B; --gold-deep:#8A6E36; --gold-lite:#E8DCC1;
  --navy:#4A6C8C; --navy-deep:#33506B;
  --card:rgba(255,255,255,.78);
  --shadow:0 10px 34px rgba(140,120,70,.11);
  --shadow-s:0 4px 16px rgba(140,120,70,.08);
  --line:rgba(185,154,91,.22);
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--ink);
  background:linear-gradient(165deg,#F8F7F4 0%,#F1EFEA 45%,#E8E5DE 100%);
  -webkit-font-smoothing:antialiased;
}
/* 背景装饰 */
.deco{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55}
.b1{width:420px;height:420px;background:#EFE7D4;top:-140px;left:-120px}
.b2{width:360px;height:360px;background:#E6E2D6;bottom:-130px;right:-100px}
.b3{width:280px;height:280px;background:#F4EFE2;top:40%;left:55%}

.app{
  position:relative;z-index:1;
  width:min(100%,900px);height:100dvh;margin:0 auto;
  display:flex;flex-direction:column;gap:10px;padding:12px;
}

/* ── 顶栏 ── */
.topbar{
  flex:none;display:flex;align-items:center;gap:12px;
  padding:9px 12px;border-radius:var(--r);
  background:var(--card);backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.9);
  box-shadow:var(--shadow);
}
.brand{display:flex;align-items:center;gap:9px;flex:none}
.mark{
  width:26px;height:26px;border-radius:9px;flex:none;
  background:linear-gradient(140deg,#E3D4B2,#B99A5B);
  box-shadow:0 4px 12px rgba(185,154,91,.42);
  position:relative;
}
.mark::after{
  content:'';position:absolute;inset:6px;
  border-radius:4px;background:rgba(255,255,255,.8);
  clip-path:polygon(0 60%,50% 0,100% 60%,100% 100%,0 100%);
}
.brand-txt{line-height:1.1}
.brand-txt b{font-size:14px;letter-spacing:.5px;font-weight:600}
.brand-txt i{
  display:block;font-style:normal;font-size:8.5px;
  letter-spacing:1.6px;color:var(--ink3);text-transform:uppercase;margin-top:2px;
}
.tabs{display:flex;gap:3px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  border:0;background:transparent;color:var(--ink2);font-family:inherit;
  font-size:12.5px;padding:7px 11px;border-radius:10px;cursor:pointer;
  white-space:nowrap;transition:.2s;
}
.tab:hover{background:rgba(200,175,120,.13);color:var(--gold-deep)}
.tab.is-on{
  background:linear-gradient(135deg,#EDE2C8,#CDB176);
  color:#4A3A16;font-weight:600;
  box-shadow:0 4px 12px rgba(185,154,91,.3);
}

/* ── 视图容器 ── */
.views{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none;flex-direction:column;gap:9px;overflow:hidden}
.view.is-on{display:flex}

/* ── 属性条 ── */
.hud{
  flex:none;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;
  padding:7px 10px;border-radius:14px;
  background:var(--card);backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.85);box-shadow:var(--shadow-s);
}
.hud::-webkit-scrollbar{display:none}
.chip{
  display:flex;align-items:center;gap:5px;flex:none;
  font-size:11.5px;color:var(--ink2);
  padding:3px 9px;border-radius:9px;background:rgba(255,255,255,.72);
  border:1px solid rgba(200,175,120,.22);
}
.chip i{width:7px;height:7px;border-radius:50%;display:block}
.chip b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.chip.bump{animation:chipBump .55s ease}
@keyframes chipBump{0%{transform:scale(1)}35%{transform:scale(1.12);background:#FBF4E4}100%{transform:scale(1)}}

/* ── 舞台 ── */
.stage{
  flex:1;min-height:0;overflow-y:auto;position:relative;
  padding:24px 22px 70px;border-radius:var(--r);cursor:pointer;
  background:var(--card);backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.9);box-shadow:var(--shadow);
  scroll-behavior:smooth;overscroll-behavior:contain;
}
.stage::-webkit-scrollbar{width:6px}
.stage::-webkit-scrollbar-thumb{background:rgba(185,154,91,.3);border-radius:3px}
.stage::-webkit-scrollbar-track{background:transparent}

.line{animation:rise .38s cubic-bezier(.2,.85,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(11px)}to{opacity:1;transform:none}}

/* 场景卡 */
.scene-title{
  text-align:center;font-size:12px;letter-spacing:.42em;text-indent:.42em;
  color:var(--gold-deep);font-weight:700;
  margin:6px 0 24px;position:relative;padding:0 12px;
}
.scene-title::before,.scene-title::after{
  content:'';position:absolute;top:50%;width:24%;height:1px;
}
.scene-title::before{left:0;background:linear-gradient(90deg,transparent,var(--gold-lite))}
.scene-title::after{right:0;background:linear-gradient(270deg,transparent,var(--gold-lite))}

/* 旁白 */
.narr{
  font-size:14.5px;line-height:1.95;color:var(--ink2);
  margin:0 0 15px;padding-left:13px;
  border-left:2px solid rgba(200,175,120,.32);
}
/* 对话 */
.say{margin:0 0 17px;display:flex;flex-direction:column;gap:6px}
.who{
  display:flex;align-items:center;gap:7px;
  font-size:12px;font-weight:700;letter-spacing:.6px;
}
.who::before{
  content:'';width:12px;height:2px;border-radius:2px;
  background:currentColor;opacity:.5;
}
.bubble{
  align-self:flex-start;max-width:90%;
  padding:12px 16px;font-size:15px;line-height:1.8;color:var(--ink);
  background:linear-gradient(135deg,rgba(255,255,255,.98),rgba(248,243,231,.95));
  border:1px solid rgba(200,175,120,.3);
  border-radius:4px 16px 16px 16px;
  box-shadow:0 5px 16px rgba(150,125,70,.1);
}
.bubble .b-cn{
  font-size:12.5px;color:var(--ink3);line-height:1.7;
  margin-top:7px;padding-top:7px;
  border-top:1px dashed rgba(200,175,120,.35);
}
.hr{
  height:1px;margin:20px 0 22px;border:0;
  background:linear-gradient(90deg,transparent,rgba(185,154,91,.45),transparent);
}

.tap-hint{
  position:absolute;right:20px;bottom:16px;
  font-size:11px;color:var(--ink3);letter-spacing:1px;
  animation:bob 1.8s ease-in-out infinite;pointer-events:none;
  transition:opacity .3s;
}
.tap-hint.off{opacity:0}
@keyframes bob{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(4px);opacity:.95}}

/* ── 选项 ── */
.choices{flex:none;display:flex;flex-direction:column;gap:7px;max-height:42%;overflow-y:auto}
.choices:empty{display:none}
.choice{
  position:relative;width:100%;text-align:left;overflow:hidden;
  padding:13px 18px;border-radius:14px;cursor:pointer;
  font-family:inherit;font-size:14.5px;color:var(--ink);
  border:1px solid rgba(200,175,120,.42);
  background:linear-gradient(135deg,rgba(255,255,255,.95),rgba(246,241,229,.92));
  box-shadow:var(--shadow-s);
  transition:.22s cubic-bezier(.2,.8,.3,1);
  animation:rise .3s cubic-bezier(.2,.85,.3,1) both;
}
.choice::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,var(--gold-lite),var(--gold));
  transform:scaleY(0);transform-origin:center;transition:.25s;
}
.choice:hover{
  transform:translateX(5px);
  border-color:rgba(185,154,91,.75);
  box-shadow:0 8px 22px rgba(170,140,80,.2);
}
.choice:hover::before{transform:scaleY(1)}

/* ── 工具栏 ── */
.tools{flex:none;display:flex;gap:7px}
.tools button{
  flex:1;padding:11px 6px;border-radius:13px;cursor:pointer;
  font-family:inherit;font-size:12.5px;color:var(--ink2);
  border:1px solid rgba(255,255,255,.9);
  background:var(--card);backdrop-filter:blur(14px);
  box-shadow:var(--shadow-s);transition:.2s;
}
.tools button:hover{background:#fff;color:var(--gold-deep);transform:translateY(-1px)}
.tools button:disabled{opacity:.38;cursor:not-allowed;transform:none}
.tools button.on{background:linear-gradient(135deg,#EDE2C8,#CDB176);color:#4A3A16;font-weight:600}

/* ── 通用面板 ── */
.panel{
  flex:1;min-height:0;overflow-y:auto;padding:20px;
  border-radius:var(--r);background:var(--card);backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.9);box-shadow:var(--shadow);
}
.panel::-webkit-scrollbar{width:6px}
.panel::-webkit-scrollbar-thumb{background:rgba(185,154,91,.3);border-radius:3px}
.p-title{
  font-size:15px;font-weight:600;color:var(--ink);margin:0 0 3px;
  display:flex;align-items:center;gap:8px;
}
.p-title::before{
  content:'';width:3px;height:15px;border-radius:2px;
  background:linear-gradient(180deg,var(--gold-lite),var(--gold));
}
.p-sub{font-size:12px;color:var(--ink3);margin:0 0 16px;line-height:1.7}
.p-sub code{
  background:rgba(255,255,255,.85);padding:1px 6px;border-radius:5px;
  font-size:11px;color:var(--gold-deep);border:1px solid var(--line);
}

/* 章节卡 */
.ch-list{display:flex;flex-direction:column;gap:9px}
.ch-card{
  display:flex;align-items:center;gap:14px;padding:15px 17px;
  border-radius:16px;cursor:pointer;transition:.22s;
  background:linear-gradient(135deg,rgba(255,255,255,.93),rgba(247,242,230,.9));
  border:1px solid rgba(255,255,255,.95);box-shadow:var(--shadow-s);
}
.ch-card:hover{transform:translateY(-2px);border-color:rgba(185,154,91,.6);box-shadow:var(--shadow)}
.ch-num{
  width:38px;height:38px;flex:none;border-radius:12px;display:grid;place-items:center;
  font-size:14px;font-weight:600;color:var(--gold-deep);
  background:linear-gradient(140deg,#F1E8D2,#DBC79A);
}
.ch-meta{flex:1;min-width:0}
.ch-meta b{display:block;font-size:14px;font-weight:600;margin-bottom:3px}
.ch-meta span{font-size:11.5px;color:var(--ink3);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-state{
  font-size:10.5px;padding:3px 9px;border-radius:8px;flex:none;
  background:rgba(220,200,150,.25);color:var(--gold-deep);
}

/* 结局卡 */
.ed-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:9px}
.ed-card{
  padding:15px 16px;border-radius:15px;position:relative;overflow:hidden;
  background:linear-gradient(140deg,rgba(255,255,255,.95),rgba(246,241,229,.9));
  border:1px solid rgba(255,255,255,.95);box-shadow:var(--shadow-s);
  transition:.2s;
}
.ed-card b{display:block;font-size:13px;margin-bottom:6px}
.ed-card p{margin:0;font-size:11.5px;line-height:1.7;color:var(--ink3)}
.ed-card.locked{opacity:.6;filter:grayscale(.5)}
.ed-card.locked b{color:var(--ink3)}
.ed-card.unlocked::after{
  content:'';position:absolute;top:0;right:0;width:36px;height:36px;
  background:linear-gradient(225deg,rgba(210,185,120,.5),transparent 70%);
}
.ed-badge{
  position:absolute;bottom:10px;right:12px;font-size:10px;color:var(--ink3);
}

/* 状态条 */
.st-row{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.st-name{width:70px;flex:none;font-size:12.5px;color:var(--ink2)}
.st-bar{flex:1;height:8px;border-radius:5px;background:rgba(220,205,170,.28);overflow:hidden}
.st-bar i{display:block;height:100%;border-radius:5px;transition:width .5s cubic-bezier(.2,.8,.3,1)}
.st-val{width:34px;text-align:right;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}

/* 回顾 */
.rc-n{font-size:13px;line-height:1.85;color:var(--ink2);margin-bottom:10px;padding-left:11px;border-left:2px solid rgba(200,175,120,.3)}
.rc-s{margin-bottom:11px;font-size:13px;line-height:1.75}
.rc-s b{display:block;font-size:11px;letter-spacing:.5px;margin-bottom:3px}
.rc-s i{display:block;font-style:normal;font-size:11.5px;color:var(--ink3);margin-top:3px}
.rc-scene{
  text-align:center;font-size:11px;letter-spacing:.35em;color:var(--gold-deep);
  font-weight:700;margin:20px 0 16px;
}
.rc-hr{height:1px;margin:14px 0;background:linear-gradient(90deg,transparent,rgba(185,154,91,.4),transparent)}

/* 工坊 */
.ta{
  width:100%;height:230px;padding:14px;border-radius:14px;resize:vertical;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:12px;line-height:1.7;color:var(--ink);
  background:rgba(255,255,255,.85);
  border:1px solid rgba(200,175,120,.4);outline:none;
  transition:.2s;tab-size:2;
}
.ta:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(185,154,91,.13)}
.btn-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{
  padding:10px 18px;border-radius:12px;cursor:pointer;font-family:inherit;font-size:13px;
  border:1px solid rgba(200,175,120,.45);color:var(--ink2);
  background:linear-gradient(135deg,rgba(255,255,255,.95),rgba(246,241,229,.92));
  box-shadow:var(--shadow-s);transition:.2s;
}
.btn:hover{transform:translateY(-1px);border-color:var(--gold);color:var(--gold-deep)}
.btn.primary{
  background:linear-gradient(135deg,#DCC79A,#B99A5B);color:#fff;border-color:transparent;
  box-shadow:0 6px 18px rgba(185,154,91,.36);
}
.btn.primary:hover{color:#fff}
.msg{font-size:12px;margin-top:10px;padding:9px 13px;border-radius:10px;display:none;line-height:1.7}
.msg.ok{display:block;background:rgba(170,215,185,.22);color:#3B7355}
.msg.err{display:block;background:rgba(235,175,165,.2);color:#A05548}

/* 结局弹层 */
.overlay{
  position:fixed;inset:0;z-index:50;display:none;
  align-items:center;justify-content:center;padding:24px;
  background:rgba(240,236,226,.72);backdrop-filter:blur(8px);
}
.overlay.is-on{display:flex;animation:fade .35s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.ov-card{
  width:min(420px,100%);padding:32px 28px;text-align:center;border-radius:24px;
  background:linear-gradient(160deg,rgba(255,255,255,.98),rgba(246,241,229,.96));
  border:1px solid rgba(255,255,255,1);
  box-shadow:0 24px 60px rgba(140,115,60,.24);
  animation:pop .45s cubic-bezier(.2,.9,.3,1) both;
}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(14px)}to{opacity:1;transform:none}}
.ov-tag{
  display:inline-block;font-size:10.5px;letter-spacing:2px;color:var(--gold-deep);
  background:rgba(220,200,150,.25);padding:4px 12px;border-radius:8px;margin-bottom:16px;
}
.ov-card h3{margin:0 0 12px;font-size:19px;font-weight:600;letter-spacing:.5px}
.ov-card p{margin:0 0 24px;font-size:13px;line-height:1.9;color:var(--ink2);white-space:pre-line}
.ov-card .btn{width:100%;margin-bottom:8px}

@media(max-width:560px){
  .app{padding:9px;gap:8px}
  .brand-txt{display:none}
  .stage{padding:18px 16px 64px}
  .bubble{max-width:96%;font-size:14.5px}
  .narr{font-size:13.5px}
  .tab{padding:7px 9px;font-size:12px}
}
</style>
</head>
<body>

<div class="deco"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span></div>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="mark"></span>
      <div class="brand-txt"><b>合租事故</b><i>co-habitation incident</i></div>
    </div>
    <nav class="tabs">
      <button class="tab is-on" data-view="story">故事</button>
      <button class="tab" data-view="chapters">章节</button>
      <button class="tab" data-view="endings">结局</button>
      <button class="tab" data-view="status">状态</button>
      <button class="tab" data-view="recap">回顾</button>
      <button class="tab" data-view="workshop">工坊</button>
    </nav>
  </header>

  <main class="views">

    <section class="view is-on" id="v-story">
      <div class="hud" id="hud"></div>
      <div class="stage" id="stage"></div>
      <div class="choices" id="choices"></div>
      <div class="tools">
        <button id="btnBack">◀ 回退</button>
        <button id="btnAuto">▷ 自动</button>
        <button id="btnRestart">↻ 重来</button>
        <button id="btnMenu">☰ 目录</button>
      </div>
    </section>

    <section class="view" id="v-chapters">
      <div class="panel">
        <h2 class="p-title">章节目录</h2>
        <p class="p-sub">已注册的章节会出现在这里。在「工坊」里重新导入同一 id 的章节即可覆盖更新。</p>
        <div class="ch-list" id="chList"></div>
      </div>
    </section>

    <section class="view" id="v-endings">
      <div class="panel">
        <h2 class="p-title">结局收集</h2>
        <p class="p-sub" id="edCount"></p>
        <div class="ed-grid" id="edGrid"></div>
      </div>
    </section>

    <section class="view" id="v-status">
      <div class="panel">
        <h2 class="p-title">当前状态</h2>
        <p class="p-sub">好感度、驯化度、暴躁值会随着你的每一次选择变化。它们会悄悄影响卡什对你的态度。</p>
        <div id="stRows"></div>
      </div>
    </section>

    <section class="view" id="v-recap">
      <div class="panel">
        <h2 class="p-title">已读回顾</h2>
        <p class="p-sub">这里按顺序记录了你这一周目读过的全部内容。回退时也会同步回退。</p>
        <div id="recapBox"></div>
      </div>
    </section>

    <section class="view" id="v-workshop">
      <div class="panel">
        <h2 class="p-title">工坊 · 导入章节</h2>
        <p class="p-sub">
          把章节代码粘贴进来，点「应用 / 覆盖」。同一 id 会覆盖旧版本 —— 修改过的旧章节也可以直接重新导入覆盖。
          支持一次粘贴多个 <code>Game.defineChapter({...})</code>。
        </p>
        <textarea class="ta" id="code" spellcheck="false" placeholder="Game.defineChapter({
  id: 'ch02',
  order: 2,
  title: '第二章 · …',
  subtitle: '副标题',
  start: 'a',
  endings: { e_ch2: { name: '第二章 · 完', desc: '…' } },
  nodes: {
    a: {
      steps: [
        { t:'scene', x:'场景一 · 名字' },
        { t:'n', x:'旁白。' },
        { t:'s', who:'卡什', x:'English line.', cn:'（中文翻译。）' },
        { t:'c', x:'【做出选择】', o:[
          { l:'选项 A', to:'b', fx:{ aff:5, dom:0, irr:-5 } },
          { l:'选项 B', to:'c', fx:{ aff:10, dom:5, irr:-5 } }
        ]}
      ]
    },
    b: { steps:[{ t:'n', x:'分支 B。' }], next:'a' },
    c: { steps:[{ t:'n', x:'分支 C。' },{ t:'end', id:'e_ch2' }] }
  }
});"></textarea>
        <div class="btn-row">
          <button class="btn primary" id="btnApply">应用 / 覆盖</button>
          <button class="btn" id="btnTpl">插入模板</button>
          <button class="btn" id="btnClearCode">清空</button>
        </div>
        <div class="msg" id="codeMsg"></div>
      </div>
    </section>

  </main>
</div>

<div class="overlay" id="ov">
  <div class="ov-card">
    <div class="ov-tag" id="ovTag">ENDING</div>
    <h3 id="ovTitle">结局</h3>
    <p id="ovDesc"></p>
    <button class="btn primary" id="ovRewind">◀ 回到刚才的选择</button>
    <button class="btn" id="ovRestart">↻ 重玩本章</button>
    <button class="btn" id="ovClose">继续停留在此</button>
  </div>
</div>

<script>
(function(){
'use strict';

/* ══════════════════ 工具 ══════════════════ */
const $  = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clone = o => JSON.parse(JSON.stringify(o));

/* ══════════════════ 属性定义 ══════════════════ */
const ATTR_DEF = {
  aff: { label:'好感度', init:30, max:100, color:'#C0A062' },
  dom: { label:'驯化度', init:10, max:100, color:'#4A6C8C' },
  irr: { label:'暴躁值', init:80, max:100, color:'#B5675A' }
};
const WHO_COLORS = { '你':'#4A6C8C', '小桁':'#4A6C8C', '莫桁':'#4A6C8C', '卡什':'#9E7F42', '卡什·洛克威尔':'#9E7F42' };
const whoColor = w => WHO_COLORS[w] || '#6E7A86';

/* ══════════════════ 全局 Game 对象 ══════════════════ */
const Game = {
  chapters: {},
  order: [],
  endings: {},
  _listeners: [],
  on(fn){ Game._listeners.push(fn); },
  _emit(){ Game._listeners.forEach(f => { try{ f(); }catch(e){} }); },

  defineChapter(def){
    if(!def || !def.id) throw new Error('章节定义缺少 id 字段');
    if(!def.nodes || !def.start) throw new Error('章节 ' + def.id + ' 缺少 nodes 或 start');
    if(!Game.chapters[def.id]) Game.order.push(def.id);
    Game.chapters[def.id] = def;

    Object.keys(Game.endings).forEach(id => {
      if(Game.endings[id].chapter === def.id) delete Game.endings[id];
    });
    if(def.endings){
      Object.keys(def.endings).forEach(k => {
        Game.endings[k] = Object.assign({ chapter: def.id, id: k }, def.endings[k]);
      });
    }

    Game.order.sort((a, b) => {
      const A = Game.chapters[a], B = Game.chapters[b];
      return (A.order == null ? 9999 : A.order) - (B.order == null ? 9999 : B.order);
    });

    Game._emit();
  },

  removeChapter(id){
    delete Game.chapters[id];
    Game.order = Game.order.filter(x => x !== id);
    Object.keys(Game.endings).forEach(k => {
      if(Game.endings[k].chapter === id) delete Game.endings[k];
    });
    Game._emit();
  }
};
window.Game = Game;

/* ══════════════════ 存档 ══════════════════ */
const SAVE_KEY = 'hzsc_save_v1';
const END_KEY  = 'hzsc_endings_v1';

let unlockedEndings = new Set();
try{
  const raw = localStorage.getItem(END_KEY);
  if(raw) unlockedEndings = new Set(JSON.parse(raw));
}catch(e){}
function persistEndings(){
  try{ localStorage.setItem(END_KEY, JSON.stringify([...unlockedEndings])); }catch(e){}
}

/* ══════════════════ 运行时状态 ══════════════════ */
const S = {
  chId:null, node:null, idx:0,
  attrs:{}, flags:{}, log:[],
  awaiting:false, ended:false
};
let history = [];
let autoTimer = null;

function freshAttrs(){
  const o = {};
  for(const k in ATTR_DEF) o[k] = ATTR_DEF[k].init;
  return o;
}
function clamp(k, v){
  const d = ATTR_DEF[k];
  if(!d) return v;
  return Math.max(0, Math.min(d.max, v));
}
function applyFx(fx){
  if(!fx) return;
  for(const k in fx){
    if(!(k in ATTR_DEF)) continue;
    const before = S.attrs[k] ?? ATTR_DEF[k].init;
    S.attrs[k] = clamp(k, before + fx[k]);
    if(S.attrs[k] !== before){
      const chip = document.querySelector('.chip[data-k="' + k + '"]');
      if(chip){ chip.classList.remove('bump'); void chip.offsetWidth; chip.classList.add('bump'); }
    }
  }
  renderHud();
}
function applySet(fx){
  if(!fx) return;
  for(const k in fx){
    if(!(k in ATTR_DEF)) continue;
    S.attrs[k] = clamp(k, fx[k]);
  }
  renderHud();
}

/* ══════════════════ 舞台渲染 ══════════════════ */
const stage = $('#stage');
const choicesBox = $('#choices');
const hudBox = $('#hud');

function appendLine(e){
  const div = document.createElement('div');
  if(e.k === 'n'){
    div.className = 'line narr';
    div.textContent = e.x;
  }else if(e.k === 's'){
    div.className = 'line say';
    const c = whoColor(e.who);
    let html = '<div class="who" style="color:' + c + '">' + esc(e.who) + '</div>' +
               '<div class="bubble">' + esc(e.x);
    if(e.cn) html += '<div class="b-cn">' + esc(e.cn) + '</div>';
    html += '</div>';
    div.innerHTML = html;
  }else if(e.k === 'scene'){
    div.className = 'line scene-title';
    div.textContent = e.x;
  }else if(e.k === 'hr'){
    div.className = 'line hr';
  }else{
    return;
  }
  stage.appendChild(div);
}

function renderLog(){
  stage.innerHTML = '';
  S.log.forEach(appendLine);
  scrollBottom();
}

function scrollBottom(){
  requestAnimationFrame(() => { stage.scrollTop = stage.scrollHeight; });
}

function renderHud(){
  hudBox.innerHTML = '';
  for(const k in ATTR_DEF){
    const d = ATTR_DEF[k];
    const v = Math.round(S.attrs[k] ?? d.init);
    const el = document.createElement('div');
    el.className = 'chip';
    el.dataset.k = k;
    el.innerHTML = '<i style="background:' + d.color + '"></i>' + d.label + ' <b>' + v + '</b>';
    hudBox.appendChild(el);
  }
}

/* ══════════════════ 选项渲染 ══════════════════ */
function clearChoices(){
  choicesBox.innerHTML = '';
  setHint(true);
}

function setHint(on){
  let h = stage.querySelector('.tap-hint');
  if(!h){
    h = document.createElement('div');
    h.className = 'tap-hint';
    h.textContent = '点击继续 ▼';
    stage.appendChild(h);
  }
  h.classList.toggle('off', !on);
}

function renderChoices(st){
  choicesBox.innerHTML = '';
  setHint(false);
  const opts = (st.o || []).filter(o => !(o.once && o.key && S.flags['opt_' + o.key]));
  opts.forEach((o, i) => {
    const b = document.createElement('button');
    b.className = 'choice';
    b.style.animationDelay = (i * 0.045) + 's';
    b.textContent = o.l;
    b.addEventListener('click', ev => { ev.stopPropagation(); choose(o); });
    choicesBox.appendChild(b);
  });
  scrollBottom();
}

/* ══════════════════ 核心流程 ══════════════════ */
function snapshot(){
  return {
    chId:S.chId, node:S.node, idx:S.idx,
    attrs:clone(S.attrs), flags:clone(S.flags),
    log:S.log.slice(), awaiting:S.awaiting, ended:S.ended
  };
}
function pushHistory(){
  history.push(snapshot());
  if(history.length > 400) history.shift();
}
function restore(snap){
  S.chId = snap.chId; S.node = snap.node; S.idx = snap.idx;
  S.attrs = snap.attrs; S.flags = snap.flags; S.log = snap.log;
  S.awaiting = snap.awaiting; S.ended = snap.ended;
  hideOverlay();
  clearChoices();
  renderLog();
  renderHud();
  updateChapterTitle();
  if(S.awaiting){
    const step = currentStep();
    if(step && step.t === 'c') renderChoices(step);
  }
}

function currentStep(){
  const ch = Game.chapters[S.chId];
  if(!ch) return null;
  const node = ch.nodes[S.node];
  if(!node) return null;
  return (node.steps || [])[S.idx] || null;
}

function advance(){
  if(S.awaiting || S.ended || !S.chId) return;
  pushHistory();
  step();
  save();
}

function step(){
  let guard = 0;
  while(guard++ < 4000){
    const ch = Game.chapters[S.chId];
    if(!ch){ finish(null); return; }
    const node = ch.nodes[S.node];
    if(!node){ finish(null); return; }
    const steps = node.steps || [];

    if(S.idx >= steps.length){
      if(node.next){ S.node = node.next; S.idx = 0; continue; }
      finish(null); return;
    }

    const st = steps[S.idx];
    switch(st.t){
      case 'n':
        S.log.push({ k:'n', x:st.x });
        S.idx++; appendLine(S.log[S.log.length - 1]); scrollBottom();
        return;

      case 's':
        S.log.push({ k:'s', who:st.who, x:st.x, cn:st.cn });
        S.idx++; appendLine(S.log[S.log.length - 1]); scrollBottom();
        return;

      case 'scene':
        S.log.push({ k:'scene', x:st.x });
        S.idx++; appendLine(S.log[S.log.length - 1]); scrollBottom();
        return;

      case 'hr':
        S.log.push({ k:'hr' });
        S.idx++; appendLine(S.log[S.log.length - 1]); scrollBottom();
        return;

      case 'fx':
        applyFx(st.fx); S.idx++; continue;

      case 'set':
        applySet(st.set); S.idx++; continue;

      case 'flag':
        S.flags[st.name] = true; S.idx++; continue;

      case 'j':
        S.node = st.to; S.idx = 0; continue;

      case 'c':
        S.awaiting = true;
        renderChoices(st);
        return;

      case 'end':
        finish(st);
        return;

      default:
        S.idx++; continue;
    }
  }
}

function choose(o){
  if(!S.awaiting) return;
  S.awaiting = false;
  clearChoices();

  if(o.fx) applyFx(o.fx);
  if(o.set) applySet(o.set);
  if(o.flag) S.flags[o.flag] = true;
  if(o.once && o.key) S.flags['opt_' + o.key] = true;

  if(o.to){
    S.node = o.to;
    S.idx = 0;
  }else{
    S.idx++;
  }
  step();
  save();
}

function finish(st){
  S.ended = true;
  S.awaiting = false;
  clearChoices();
  setHint(false);

  if(st && st.id){
    unlockedEndings.add(st.id);
    persistEndings();
    const meta = Game.endings[st.id] || { name:'未命名结局', desc:'' };
    showOverlay('ENDING', meta.name || st.id, meta.desc || '');
  }else{
    showOverlay('CHAPTER', '本章结束', '故事在这里暂时停下了。');
  }
  save();
}

/* ══════════════════ 覆盖层 ══════════════════ */
const ov = $('#ov');
function showOverlay(tag, title, desc){
  $('#ovTag').textContent = tag;
  $('#ovTitle').textContent = title;
  $('#ovDesc').textContent = desc || '';
  ov.classList.add('is-on');
}
function hideOverlay(){ ov.classList.remove('is-on'); }

$('#ovClose').addEventListener('click', hideOverlay);
$('#ovRestart').addEventListener('click', () => { hideOverlay(); startChapter(S.chId); });
$('#ovRewind').addEventListener('click', () => { hideOverlay(); rewindToChoice(); });

/* ══════════════════ 回退 ══════════════════ */
function rewind(){
  if(!history.length){ flashHint('已经回到最开始了'); return; }
  restore(history.pop());
  save();
}
function rewindToChoice(){
  while(history.length){
    const snap = history.pop();
    const ch = Game.chapters[snap.chId];
    const node = ch && ch.nodes[snap.node];
    const st = node && (node.steps || [])[snap.idx];
    restore(snap);
    if(st && st.t === 'c'){
      S.awaiting = true;
      renderChoices(st);
      return;
    }
  }
  rewind();
}
function flashHint(txt){
  const h = $('#hint') || stage.querySelector('.tap-hint');
  if(stage.querySelector('.tap-hint')){
    const hh = stage.querySelector('.tap-hint');
    hh.textContent = txt;
    hh.classList.remove('off');
    setTimeout(() => { hh.textContent = '点击继续 ▼'; }, 1400);
  }
}

/* ══════════════════ 章节启停 ══════════════════ */
function startChapter(chId){
  const ch = Game.chapters[chId];
  if(!ch) return;
  if(!Object.keys(S.attrs).length) S.attrs = freshAttrs();
  S.chId = chId;
  S.node = ch.start;
  S.idx = 0;
  S.log = [];
  S.ended = false;
  S.awaiting = false;
  history = [];
  clearChoices();
  stage.innerHTML = '';
  hideOverlay();
  updateChapterTitle();
  renderHud();
  renderLog();
  step();
  save();
  setView('story');
}

function restartCurrent(){
  if(!S.chId) return;
  startChapter(S.chId);
}

/* ══════════════════ 存档 ══════════════════ */
function save(){
  try{
    if(S.ended){ localStorage.removeItem(SAVE_KEY); return; }
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      chId:S.chId, node:S.node, idx:S.idx,
      attrs:S.attrs, flags:S.flags, log:S.log
    }));
  }catch(e){}
}
function load(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    const d = JSON.parse(raw);
    if(!d.chId || !Game.chapters[d.chId]) return false;
    S.chId = d.chId; S.node = d.node; S.idx = d.idx;
    S.attrs = Object.assign(freshAttrs(), d.attrs || {});
    S.flags = d.flags || {};
    S.log = d.log || [];
    S.ended = false; S.awaiting = false;
    history = [];
    renderHud(); renderLog(); updateChapterTitle();
    step();
    return true;
  }catch(e){ return false; }
}

/* ══════════════════ 视图切换 ══════════════════ */
function setView(name){
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('is-on', v.id === 'v-' + name));
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('is-on', t.dataset.view === name));
  if(name === 'chapters') renderChapterList();
  if(name === 'endings')  renderEndings();
  if(name === 'status')   renderStatus();
  if(name === 'recap')    renderRecap();
}

document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => setView(t.dataset.view));
});
$('#btnMenu').addEventListener('click', () => setView('chapters'));

/* ══════════════════ 章节列表 ══════════════════ */
function renderChapterList(){
  const box = $('#chList');
  box.innerHTML = '';
  if(!Game.order.length){
    box.innerHTML = '<p class="p-sub">还没有任何章节。去「工坊」导入一段代码吧。</p>';
    return;
  }
  Game.order.forEach((id, i) => {
    const ch = Game.chapters[id];
    const card = document.createElement('div');
    card.className = 'ch-card';
    const playing = (S.chId === id && !S.ended);
    card.innerHTML =
      '<div class="ch-num">' + String(i + 1).padStart(2, '0') + '</div>' +
      '<div class="ch-meta"><b>' + esc(ch.title || id) + '</b>' +
      '<span>' + esc(ch.subtitle || '') + '</span></div>' +
      '<div class="ch-state">' + (playing ? '进行中' : '开始') + '</div>';
    card.addEventListener('click', () => startChapter(id));
    box.appendChild(card);
  });
}

/* ══════════════════ 结局收集 ══════════════════ */
function renderEndings(){
  const grid = $('#edGrid');
  grid.innerHTML = '';
  const ids = Object.keys(Game.endings);
  if(!ids.length){
    grid.innerHTML = '<p class="p-sub">还没有注册任何结局。</p>';
    $('#edCount').textContent = '';
    return;
  }
  let got = 0;
  ids.forEach(id => {
    const meta = Game.endings[id];
    const on = unlockedEndings.has(id);
    if(on) got++;
    const card = document.createElement('div');
    card.className = 'ed-card ' + (on ? 'unlocked' : 'locked');
    card.innerHTML =
      '<b>' + (on ? esc(meta.name || id) : '？？？') + '</b>' +
      '<p>' + (on ? esc(meta.desc || '') : '尚未抵达的结局。') + '</p>' +
      '<div class="ed-badge">' + (on ? '已解锁' : '未解锁') + '</div>';
    grid.appendChild(card);
  });
  $('#edCount').textContent = '已解锁 ' + got + ' / ' + ids.length + ' 个结局。';
}

/* ══════════════════ 状态面板 ══════════════════ */
function renderStatus(){
  const box = $('#stRows');
  box.innerHTML = '';
  for(const k in ATTR_DEF){
    const d = ATTR_DEF[k];
    const v = Math.round(S.attrs[k] ?? d.init);
    const pct = Math.round(v / d.max * 100);
    const row = document.createElement('div');
    row.className = 'st-row';
    row.innerHTML =
      '<div class="st-name">' + d.label + '</div>' +
      '<div class="st-bar"><i style="width:' + pct + '%;background:' + d.color + '"></i></div>' +
      '<div class="st-val">' + v + '</div>';
    box.appendChild(row);
  }
  const extra = document.createElement('p');
  extra.className = 'p-sub';
  extra.style.marginTop = '18px';
  extra.textContent = '已解锁结局：' + unlockedEndings.size + ' 个 ｜ 已注册章节：' + Game.order.length + ' 章';
  box.appendChild(extra);
}

/* ══════════════════ 回顾面板 ══════════════════ */
function renderRecap(){
  const box = $('#recapBox');
  if(!S.log.length){
    box.innerHTML = '<p class="p-sub">还没有任何记录。</p>';
    return;
  }
  box.innerHTML = S.log.map(e => {
    if(e.k === 'n')     return '<div class="rc-n">' + esc(e.x) + '</div>';
    if(e.k === 'scene') return '<div class="rc-scene">' + esc(e.x) + '</div>';
    if(e.k === 'hr')    return '<div class="rc-hr"></div>';
    if(e.k === 's'){
      return '<div class="rc-s">' +
        '<b style="color:' + whoColor(e.who) + '">' + esc(e.who) + '</b>' +
        '<span>' + esc(e.x) + '</span>' +
        (e.cn ? '<i>' + esc(e.cn) + '</i>' : '') +
      '</div>';
    }
    return '';
  }).join('');
}

    this.classList.remove('on'); this.textContent = '▷ 自动';
  }else{

      if(S.awaiting || S.ended){
        clearInterval(autoTimer); autoTimer = null;

      }
      advance();

    if(!$('#v-story').classList.contains('is-on')) return;
    if(document.activeElement && document.activeElement.tagName === 'TEXTAREA') return;
    e.preventDefault();
    if(!S.awaiting && !S.ended) advance();
  }
  if(e.key === 'Backspace'){
    if(document.activeElement && document.activeElement.tagName === 'TEXTAREA') return;
    e.preventDefault();
    rewind();
  }
});
