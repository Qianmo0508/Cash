<!DOCTYPE html>
<html lang="zh-CN">
<!--
================================================================================
  和室友恋爱的错误示范 · 单文件文字游戏引擎
================================================================================

  【如何导入新章节 / Q&A / 档案 / 关系 / 彩蛋副本】

  1. 打开游戏 → 主页 → 「代码工坊」
  2. 在顶部选择数据类型（章节 / 羁绊问答 / 角色档案 / 人际关系 / 彩蛋副本 / 好感度等级表）
  3. 把 JSON 粘贴进输入框（可以粘贴单个对象，也可以粘贴一个数组一次导入多条）
  4. 点击「校验并导入」
  5. 若 id 已存在 → 整体覆盖更新；若 id 是新的 → 追加
  6. 导入成功立即生效，写入 localStorage，退出浏览器不丢失

  【导出 / 分享】
  主页 → 「分享」→ 生成 HZY_export_日期时间.json
  对方在主页 → 「导入」→ 选择该文件 → 即可获得同样的剧情库 + 存档 + 解锁状态

  【数据 key 约定】
  hzy_save_main            主线存档
  hzy_save_slots_1~3       手动存档槽
  hzy_save_side_<id>       彩蛋副本独立存档
  hzy_data_chapters        章节库
  hzy_data_qna             羁绊问答库
  hzy_data_charinfo        角色档案库
  hzy_data_relations       人际关系库
  hzy_data_sides           彩蛋副本库
  hzy_data_affection_levels 好感度等级表
  hzy_config               UI 配置
================================================================================
-->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FFFBF2">
<title>和室友恋爱的错误示范</title>
<style>
/* ============================================================================
   0. 变量 / 主题
   ============================================================================ */
:root{
  --bg:#FFFBF2;
  --bg2:#FDF5E7;
  --paper:#FFFFFF;
  --paper-2:#FFFDF8;
  --ink:#3A322C;
  --ink-soft:#8A7C6E;
  --ink-faint:#B9AC9C;
  --cash:#E86A48;
  --cash-soft:#F5B7A2;
  --mott:#4A6FA5;
  --mott-soft:#A8C0DE;
  --gold:#F2C14E;
  --line:#EBE0CF;
  --line-soft:#F4ECDF;
  --shadow:0 4px 18px rgba(140,115,85,.10);
  --shadow-lg:0 12px 40px rgba(140,115,85,.18);
  --radius:16px;
  --font-serif:"Noto Serif SC","Source Han Serif SC","Songti SC",Georgia,"PingFang SC",serif;
  --font-sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,sans-serif;
  --fs:1;
}
[data-theme="dark"]{
  --bg:#1C1917;
  --bg2:#231F1C;
  --paper:#2A2522;
  --paper-2:#302A26;
  --ink:#EDE4D8;
  --ink-soft:#A99A88;
  --ink-faint:#6E6257;
  --line:#3B3430;
  --line-soft:#332D29;
  --shadow:0 4px 18px rgba(0,0,0,.45);
  --shadow-lg:0 12px 40px rgba(0,0,0,.6);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:var(--font-serif);
  font-size:calc(16px * var(--fs));
  background:var(--bg);
  color:var(--ink);
  line-height:1.85;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  transition:background .3s ease,color .3s ease;
}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer;font-size:inherit;}
input,textarea,select{font-family:var(--font-sans);color:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

/* ============================================================================
   1. 页面容器
   ============================================================================ */
#app{position:fixed;inset:0;overflow:hidden;}
.page{
  position:absolute;inset:0;
  display:none;
  flex-direction:column;
  opacity:0;
  transition:opacity .3s ease;
}
.page.active{display:flex;opacity:1;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
.fade-in{animation:fadeIn .35s ease both;}

/* CRT 滤镜（可选开关） */
body.crt::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:9999;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.035) 0px,rgba(0,0,0,.035) 1px,transparent 1px,transparent 3px);
  mix-blend-mode:multiply;
}

/* ============================================================================
   2. 主页
   ============================================================================ */
#page-home{
  align-items:center;justify-content:center;
  background:
    radial-gradient(circle at 18% 12%, rgba(232,106,72,.09), transparent 45%),
    radial-gradient(circle at 84% 82%, rgba(74,111,165,.09), transparent 45%),
    var(--bg);
  overflow-y:auto;
}
.home-deco{
  position:absolute;inset:0;pointer-events:none;overflow:hidden;
}
.home-deco .fox{
  position:absolute;right:-8%;bottom:-6%;width:min(58vw,520px);opacity:.055;
  fill:var(--cash);
}
[data-theme="dark"] .home-deco .fox{opacity:.09;}
.home-deco .staff{
  position:absolute;left:-6%;top:8%;width:min(40vw,320px);opacity:.05;
  fill:var(--mott);
}
.home-deco .dot{
  position:absolute;border-radius:50%;filter:blur(1px);
  animation:floaty 9s ease-in-out infinite;
}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(0);}50%{transform:translateY(-22px) rotate(12deg);}}

.home-inner{
  position:relative;z-index:2;
  width:min(560px,90vw);
  padding:48px 24px 40px;
  text-align:center;
}
.home-sub{
  font-family:var(--font-sans);
  font-size:.74rem;letter-spacing:.42em;text-transform:uppercase;
  color:var(--ink-faint);margin-bottom:22px;
}
.home-title{
  font-size:clamp(2rem,8.5vw,3.1rem);
  font-weight:600;
  letter-spacing:.10em;
  line-height:1.35;
  margin-bottom:6px;
  background:linear-gradient(135deg,var(--ink) 20%,var(--cash) 130%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
[data-theme="dark"] .home-title{
  background:linear-gradient(135deg,var(--ink) 20%,var(--cash-soft) 130%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.home-tagline{
  font-size:.92rem;color:var(--ink-soft);letter-spacing:.12em;
  margin-bottom:40px;
}
.home-actions{
  display:flex;flex-direction:column;gap:12px;
  margin-bottom:32px;
}
.btn{
  position:relative;
  padding:14px 24px;
  border-radius:14px;
  background:var(--paper);
  border:1px solid var(--line);
  box-shadow:var(--shadow);
  letter-spacing:.12em;
  font-size:.96rem;
  transition:transform .2s ease,box-shadow .2s ease,background .2s ease,border-color .2s ease;
}
.btn:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--cash-soft);}
.btn:active{transform:translateY(0) scale(.985);}
.btn-primary{
  background:linear-gradient(135deg,var(--cash),#D9553A);
  color:#fff;border-color:transparent;
  box-shadow:0 8px 26px rgba(232,106,72,.32);
}
.btn-primary:hover{box-shadow:0 12px 34px rgba(232,106,72,.44);}
.btn[disabled]{opacity:.42;cursor:not-allowed;transform:none!important;box-shadow:var(--shadow)!important;}
.btn.sm{padding:9px 16px;font-size:.85rem;border-radius:11px;}
.home-foot{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.mini{
  font-family:var(--font-sans);
  font-size:.78rem;letter-spacing:.14em;color:var(--ink-soft);
  padding:7px 14px;border-radius:20px;border:1px dashed var(--line);
  transition:all .2s ease;
}
.mini:hover{color:var(--cash);border-color:var(--cash-soft);background:var(--paper);}
.home-version{
  margin-top:34px;font-family:var(--font-sans);font-size:.68rem;
  color:var(--ink-faint);letter-spacing:.16em;
}
.integrity-banner{
  margin:0 auto 22px;max-width:520px;
  background:#FFF4E0;border:1px solid #F2D9A8;border-radius:12px;
  padding:12px 16px;font-size:.82rem;color:#8A6A2E;text-align:left;
  font-family:var(--font-sans);
}
[data-theme="dark"] .integrity-banner{background:#3A2F1E;border-color:#5A4726;color:#E0C48A;}

/* ============================================================================
   3. 游戏页
   ============================================================================ */
#page-game{background:var(--bg);}
.game-top{
  flex:0 0 auto;
  display:flex;align-items:center;gap:12px;
  padding:10px 14px;
  padding-top:calc(10px + env(safe-area-inset-top));
  background:var(--bg2);
  border-bottom:1px solid var(--line-soft);
  z-index:5;
}
.icon-btn{
  width:34px;height:34px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:1.05rem;color:var(--ink-soft);
  transition:background .2s ease,color .2s ease;
  flex:0 0 auto;
}
.icon-btn:hover{background:var(--paper);color:var(--cash);}
.chapter-title{
  flex:1 1 auto;min-width:0;
  font-size:.85rem;letter-spacing:.08em;color:var(--ink-soft);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.aff-wrap{flex:0 0 auto;display:flex;align-items:center;gap:8px;}
.aff-track{
  position:relative;width:clamp(70px,20vw,130px);height:8px;
  background:var(--line-soft);border-radius:8px;overflow:hidden;
  border:1px solid var(--line);
}
.aff-fill{
  height:100%;width:0%;
  background:linear-gradient(90deg,var(--gold),var(--cash));
  border-radius:8px;
  transition:width .55s cubic-bezier(.2,.9,.3,1);
}
.aff-num{
  font-family:var(--font-sans);font-size:.78rem;font-weight:600;
  color:var(--cash);min-width:26px;text-align:right;
}
.aff-level-tag{
  font-family:var(--font-sans);font-size:.66rem;
  padding:2px 8px;border-radius:10px;
  background:linear-gradient(135deg,rgba(242,193,78,.24),rgba(232,106,72,.24));
  color:var(--cash);white-space:nowrap;
}

/* 舞台 */
.game-stage{
  position:relative;flex:1 1 auto;overflow:hidden;
  display:flex;flex-direction:column;justify-content:flex-end;
}
.stage-bg{
  position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(circle at 50% 22%, rgba(232,106,72,.055), transparent 58%),
    radial-gradient(circle at 12% 78%, rgba(74,111,165,.05), transparent 52%);
}
.portrait-zone{
  position:absolute;left:50%;top:6%;transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;
  z-index:1;
}
.portrait{
  width:clamp(96px,26vw,150px);height:clamp(96px,26vw,150px);
  border-radius:50%;
  background:linear-gradient(145deg,#FFF0E4,#FFE0CE);
  border:2px solid var(--paper);
  box-shadow:0 10px 30px rgba(232,106,72,.20), inset 0 0 30px rgba(255,255,255,.7);
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(2.4rem,9vw,3.6rem);
  cursor:pointer;user-select:none;
  transition:transform .25s cubic-bezier(.34,1.56,.64,1),box-shadow .25s ease;
}
[data-theme="dark"] .portrait{background:linear-gradient(145deg,#3A2A22,#2E211B);border-color:#3E322A;box-shadow:0 10px 30px rgba(0,0,0,.5);}
.portrait:active{transform:scale(.93);}
.portrait.pop{animation:portraitPop .4s cubic-bezier(.34,1.56,.64,1);}
@keyframes portraitPop{0%{transform:scale(1);}45%{transform:scale(1.10) rotate(-3deg);}100%{transform:scale(1);}}
.touch-bubble{
  position:absolute;top:-6px;left:50%;transform:translate(-50%,-100%) scale(.85);
  background:var(--paper);border:1px solid var(--line);
  border-radius:14px;padding:8px 14px;
  font-size:.8rem;line-height:1.55;white-space:nowrap;
  box-shadow:var(--shadow);
  opacity:0;pointer-events:none;
  transition:opacity .28s ease,transform .28s cubic-bezier(.34,1.56,.64,1);
  max-width:min(78vw,420px);white-space:normal;text-align:center;
}
.touch-bubble.show{opacity:1;transform:translate(-50%,-100%) scale(1);}

/* 对话框 */
.dialogue-outer{
  position:relative;z-index:3;
  padding:0 14px 14px;
  padding-bottom:calc(14px + env(safe-area-inset-bottom));
}
.dialogue-box{
  position:relative;
  min-height:clamp(140px,26vh,220px);
  background:rgba(255,255,255,.90);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow-lg);
  padding:34px 22px 26px;
  cursor:pointer;
  transition:background .3s ease,border-color .3s ease;
}
[data-theme="dark"] .dialogue-box{background:rgba(42,37,34,.92);}
.dialogue-box.narration{background:rgba(255,251,242,.86);}
[data-theme="dark"] .dialogue-box.narration{background:rgba(35,31,28,.92);}
.dialogue-box.inner .dialogue-text{
  font-style:italic;color:var(--ink-soft);
}
.speaker-tag{
  position:absolute;top:-15px;left:20px;
  display:inline-flex;align-items:center;
  padding:4px 16px;
  border-radius:9px 9px 9px 2px;
  background:linear-gradient(135deg,var(--cash),#D9553A);
  color:#fff;font-size:.80rem;letter-spacing:.12em;
  box-shadow:0 4px 14px rgba(232,106,72,.34);
  max-width:70%;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.dialogue-box.inner .speaker-tag{background:linear-gradient(135deg,var(--mott),#3A5A8A);box-shadow:0 4px 14px rgba(74,111,165,.34);}
.dialogue-text{
  font-size:clamp(.95rem,3.7vw,1.06rem);
  line-height:1.95;letter-spacing:.02em;
  word-break:break-word;
  min-height:2em;
}
.continue-hint{
  position:absolute;right:18px;bottom:12px;
  font-size:.8rem;color:var(--cash);opacity:0;
  animation:bob 1.4s ease-in-out infinite;
}
.continue-hint.show{opacity:.85;}
@keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(4px);}}

/* 选项 */
.choices{
  position:absolute;inset:0;z-index:6;
  display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;padding:24px;
  background:rgba(255,251,242,.72);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
}
[data-theme="dark"] .choices{background:rgba(20,18,16,.72);}
.choices.show{display:flex;animation:fadeIn .28s ease;}
.choice-btn{
  width:min(520px,92%);text-align:left;
  padding:15px 22px;border-radius:999px;
  background:var(--paper);
  border:1.5px solid var(--line);
  box-shadow:var(--shadow);
  font-size:.95rem;line-height:1.6;letter-spacing:.03em;
  transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease,background .2s ease;
  animation:fadeIn .34s ease both;
}
.choice-btn:hover{
  transform:translateY(-2px) scale(1.012);
  border-color:var(--cash-soft);
  box-shadow:0 8px 26px rgba(232,106,72,.26);
  background:linear-gradient(135deg,var(--paper),#FFF6F0);
}
[data-theme="dark"] .choice-btn:hover{background:linear-gradient(135deg,#332C27,#3D2E26);}
.choice-btn:active{transform:scale(.985);}
.choice-btn:nth-child(1){animation-delay:.02s;}
.choice-btn:nth-child(2){animation-delay:.07s;}
.choice-btn:nth-child(3){animation-delay:.12s;}
.choice-btn:nth-child(4){animation-delay:.17s;}
.choice-btn:nth-child(5){animation-delay:.22s;}

/* 底栏 */
.game-bottom{
  flex:0 0 auto;
  display:flex;gap:6px;justify-content:center;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  background:var(--bg2);
  border-top:1px solid var(--line-soft);
}
.game-bottom .icon-btn{width:auto;padding:0 12px;font-size:.8rem;letter-spacing:.1em;font-family:var(--font-sans);}
.game-bottom .icon-btn.on{color:var(--cash);background:var(--paper);}

/* ============================================================================
   4. 通用子页面
   ============================================================================ */
.sub-top{
  flex:0 0 auto;display:flex;align-items:center;gap:12px;
  padding:14px 16px;
  padding-top:calc(14px + env(safe-area-inset-top));
  background:var(--bg2);border-bottom:1px solid var(--line-soft);
  position:sticky;top:0;z-index:20;
}
.sub-title{font-size:1rem;letter-spacing:.14em;font-weight:600;}
.sub-title small{
  display:block;font-size:.66rem;letter-spacing:.2em;
  color:var(--ink-faint);font-weight:400;font-family:var(--font-sans);
}
.sub-body{
  flex:1 1 auto;overflow-y:auto;
  padding:18px 16px calc(40px + env(safe-area-inset-bottom));
  -webkit-overflow-scrolling:touch;
}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
.tab{
  padding:7px 16px;border-radius:999px;font-size:.82rem;
  border:1px solid var(--line);background:var(--paper);color:var(--ink-soft);
  transition:all .2s ease;font-family:var(--font-sans);
}
.tab:hover{border-color:var(--cash-soft);color:var(--cash);}
.tab.active{background:linear-gradient(135deg,var(--cash),#D9553A);color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(232,106,72,.28);}

/* 卡片网格 */
.card-grid{display:grid;grid-template-columns:1fr;gap:14px;}
@media(min-width:720px){.card-grid{grid-template-columns:1fr 1fr;}}
@media(min-width:1100px){.card-grid{grid-template-columns:1fr 1fr 1fr;}}
.card{
  background:var(--paper);border:1px solid var(--line);
  border-radius:14px;padding:16px 18px;
  box-shadow:var(--shadow);
  transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;
}
.card.clickable{cursor:pointer;}
.card.clickable:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--cash-soft);}
.card.locked{opacity:.62;filter:grayscale(.35);cursor:not-allowed;}
.card.locked:hover{transform:none;box-shadow:var(--shadow);border-color:var(--line);}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:6px;}
.card-title{font-size:.98rem;font-weight:600;letter-spacing:.04em;line-height:1.5;}
.card-cat{
  font-family:var(--font-sans);font-size:.66rem;padding:3px 9px;border-radius:8px;
  background:var(--line-soft);color:var(--ink-soft);white-space:nowrap;flex:0 0 auto;
}
.card-desc{font-size:.85rem;color:var(--ink-soft);line-height:1.8;}
.card-lock{
  margin-top:10px;font-family:var(--font-sans);font-size:.72rem;
  color:var(--ink-faint);display:flex;align-items:center;gap:6px;
}
.card-answer{
  margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);
  font-size:.90rem;line-height:1.9;color:var(--ink);
  animation:fadeIn .3s ease;
}
.card-answer .ans-label{
  font-family:var(--font-sans);font-size:.68rem;letter-spacing:.18em;
  color:var(--cash);display:block;margin-bottom:6px;
}
.empty-tip{
  text-align:center;padding:56px 20px;color:var(--ink-faint);
  font-size:.86rem;line-height:2;font-family:var(--font-sans);
}
.empty-tip .big{font-size:2rem;display:block;margin-bottom:12px;opacity:.5;}

/* 搜索 */
.search-bar{
  display:flex;align-items:center;gap:8px;
  background:var(--paper);border:1px solid var(--line);border-radius:999px;
  padding:8px 16px;margin-bottom:16px;
}
.search-bar input{
  flex:1;border:none;background:transparent;outline:none;font-size:.86rem;
}
.search-bar .ico{color:var(--ink-faint);font-size:.9rem;}

/* 人际关系网 */
.rel-graph{
  position:relative;display:flex;flex-wrap:wrap;gap:14px;justify-content:center;
  padding:10px 0 24px;
}
.rel-node{
  position:relative;
  width:min(260px,44%);
  min-width:150px;
  background:var(--paper);border:1px solid var(--line);
  border-radius:14px;padding:14px;text-align:center;
  box-shadow:var(--shadow);
  transition:transform .2s ease,box-shadow .2s ease;
}
@media(max-width:520px){.rel-node{width:100%;}}
.rel-node:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);}
.rel-node .avatar{
  width:46px;height:46px;border-radius:50%;margin:0 auto 8px;
  display:flex;align-items:center;justify-content:center;
  font-size:1.4rem;
  background:linear-gradient(135deg,var(--gold),var(--cash));
  color:#fff;
}
.rel-node .rname{font-size:.92rem;font-weight:600;letter-spacing:.06em;}
.rel-node .rrole{font-size:.72rem;color:var(--cash);font-family:var(--font-sans);margin-bottom:6px;}
.rel-node .rdesc{font-size:.79rem;color:var(--ink-soft);line-height:1.75;}

/* ============================================================================
   5. 代码工坊
   ============================================================================ */
.ws-panel{
  background:var(--paper);border:1px solid var(--line);border-radius:16px;
  padding:18px;box-shadow:var(--shadow);margin-bottom:18px;
}
.ws-label{
  font-family:var(--font-sans);font-size:.72rem;letter-spacing:.2em;

@keyframes toastIn{from{opacity:0;transform:translateY(-14px) scale(.94);}to{opacity:1;transform:none;}}

#affPopWrap{

<script>
(function(){
'use strict';

/* ============================================================================
   ============================  PART 0 · 工具函数  ============================
   ============================================================================ */
const $  = (s, r) => (r||document).querySelector(s);
const $$ = (s, r) => Array.prototype.slice.call((r||document).querySelectorAll(s));
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => (
  {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
));
const nowISO = () => new Date().toISOString();
const pad2 = n => (n<10?'0':'') + n;
function fmtDate(ts){
  if(!ts) return '——';
  const d = new Date(ts);
  return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())+' '+
         pad2(d.getHours())+':'+pad2(d.getMinutes());
}
function dateKey(){
  const d = new Date();
  return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
}
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }

/** Toast 提示 */
function toast(msg, type){
  const wrap = $('#toastWrap');
  const el = document.createElement('div');
  el.className = 'toast' + (type ? ' '+type : '');
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>{
    el.classList.add('out');
    setTimeout(()=>el.remove(), 380);
  }, 2500);
}

/** 下载文本文件 */
function download(filename, text){
  const blob = new Blob([text], {type:'application/json;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1500);
}

/* ============================================================================
   ============================  PART 1 · 存储层  =============================
   ============================================================================ */
/** localStorage key 约定 —— 所有 key 集中在这里，方便维护 */
const K = {
  main:        'hzy_save_main',
  slots:       ['hzy_save_slots_1','hzy_save_slots_2','hzy_save_slots_3'],
  chapters:    'hzy_data_chapters',
  qna:         'hzy_data_qna',
  charinfo:    'hzy_data_charinfo',
  relations:   'hzy_data_relations',
  sides:       'hzy_data_sides',
  levels:      'hzy_data_affection_levels',
  config:      'hzy_config',
  achievements:'hzy_achievements',
  daily:       'hzy_daily'
};
const sideSaveKey = id => 'hzy_save_side_' + id;

/** 安全的 localStorage 读写封装 */
const store = {
  get(key, def){
    try{
      const raw = localStorage.getItem(key);
      if (raw === null || raw === undefined) return def;
      return JSON.parse(raw);
    }catch(e){
      console.warn('[store] 读取失败:', key, e);
      return def;
    }
  },
  set(key, val){
    try{
      localStorage.setItem(key, JSON.stringify(val));
      return true;
    }catch(e){
      console.warn('[store] 写入失败:', key, e);
      toast('本地存储写入失败（可能空间已满）', 'err');
      return false;
    }
  },
  del(key){ try{ localStorage.removeItem(key); }catch(e){} }
};

/* ============================================================================
   =========================  PART 2 · 默认数据  ==============================
   ============================================================================ */

/** 默认好感度等级表（可被代码工坊覆盖） */
const DEFAULT_LEVELS = [
  { min:1,   max:9,   name:'陌生人' },

/* ============================================================================
   =========================  PART 4 · 存档系统  ==============================
   ============================================================================ */

function newMainSave(){
  return {
    version:1,
    affection:1,
    chapterId:null,
    beatIndex:0,
    started:false,
    seen:{},
    history:[],
    applied:{},
    notifiedLevels:[],
    achievements:[],
    updated:Date.now()
  };
}

function loadMain(){
  const s = store.get(K.main, null);
  mainSave = (s && typeof s === 'object') ? Object.assign(newMainSave(), s) : newMainSave();
  App.seen    = mainSave.seen;
  App.history = mainSave.history;
  App.applied = mainSave.applied;
}

function saveMain(){
  mainSave.updated = Date.now();
  store.set(K.main, mainSave);
}

/** 保存进度（章节/beat） */
function saveProgress(){
  if (App.mode === 'side'){
    // 副本存档完全独立
    if (App.sideId){
      store.set(sideSaveKey(App.sideId), {
        beatIndex: App.beatIndex,
        applied: App.appliedSide,
        updated: Date.now()
      });
    }
    return;
  }
  mainSave.chapterId = App.chapter ? App.chapter.id : mainSave.chapterId;
  mainSave.beatIndex = App.beatIndex;
  mainSave.started = true;
  saveMain();
}

/** 手动存档到槽位 */
function saveToSlot(i){
  if (App.mode !== 'main'){ toast('副本中无法保存到主线存档槽', 'warn'); return; }
  const slot = {
    ts: Date.now(),
    affection: mainSave.affection,
    chapterId: mainSave.chapterId,
    chapterTitle: App.chapter ? App.chapter.title : '（未知章节）',
    beatIndex: App.beatIndex,
    summary: buildSummary(),
    save: JSON.parse(JSON.stringify(mainSave))
  };
  store.set(K.slots[i], slot);
  toast('已保存到存档槽 ' + (i+1), 'ok');
}

function buildSummary(){
  const last = (mainSave.history || []).slice(-1)[0];
  if (!last) return '故事刚刚开始。';
  return (last.speaker ? last.speaker + '：' : '') + String(last.text||'').slice(0, 26);
}

function loadFromSlot(i){
  const slot = store.get(K.slots[i], null);
  if (!slot || !slot.save){ toast('该存档槽为空', 'warn'); return; }
  mainSave = Object.assign(newMainSave(), slot.save);
  App.seen    = mainSave.seen;
  App.history = mainSave.history;
  App.applied = mainSave.applied;
  saveMain();
  closeModal();
  continueGame();
  toast('已读取存档槽 ' + (i+1), 'ok');
}

function deleteSlot(i){
  store.del(K.slots[i]);
  toast('已删除存档槽 ' + (i+1));
  openSlotsModal();
}

/* ============================================================================
   =========================  PART 5 · 好感度系统  ============================
   ============================================================================ */

function getAffection(){
  return mainSave ? mainSave.affection : 1;
}

function getLevelName(v){
  const lv = DB.levels || DEFAULT_LEVELS;
  for (let i=0;i<lv.length;i++){
    if (v >= lv[i].min && v <= lv[i].max) return lv[i].name;
  }
  // 超出范围时退回到最接近的
  if (lv.length && v > lv[lv.length-1].max) return lv[lv.length-1].name;
  if (lv.length && v < lv[0].min) return lv[0].name;
  return '未知';
}

function getLevelObj(v){
  const lv = DB.levels || DEFAULT_LEVELS;
  for (let i=0;i<lv.length;i++){
    if (v >= lv[i].min && v <= lv[i].max) return lv[i];
  }
  return null;
}

/** 好感度变化 */
function changeAffection(n){
  if (!n) return;
  showAffPop(n);

  // 副本模式：不影响主线，仅做视觉反馈
  if (App.mode === 'side') return;

  const oldVal = mainSave.affection;
  const newVal = clamp(oldVal + n, 1, 100);
  if (newVal === oldVal) return;

  mainSave.affection = newVal;
  updateAffectionUI();
  checkLevelUp(oldVal, newVal);
  checkAchievements();
  saveMain();
}

/** 好感度浮动气泡 */
function showAffPop(n){
  const wrap = $('#affPopWrap');
  const el = document.createElement('div');
  el.className = 'aff-pop ' + (n > 0 ? 'up' : 'down');
  el.textContent = (n > 0 ? '+' : '') + n + ' 好感度';
  wrap.appendChild(el);
  setTimeout(()=>el.remove(), 1600);
}

/** 等级提升特效 */
function checkLevelUp(oldVal, newVal){
  const oldLv = getLevelObj(oldVal);
  const newLv = getLevelObj(newVal);
  if (!newLv) return;
  if (oldLv && oldLv.name === newLv.name) return;
  if (!DB.config.showLevelUp) return;

  const wrap = $('#levelUpWrap');
  wrap.innerHTML =
    '<div class="lu-card">' +
      '<div class="lu-small">好感度等级提升</div>' +
      '<div class="lu-name">' + esc(newLv.name) + '</div>' +
      '<div class="lu-num">' + newVal + ' / 100</div>' +
    '</div>';
  wrap.classList.add('show');
  setTimeout(()=>{ wrap.classList.remove('show'); }, 2400);
}

/** 更新顶部 UI */
function updateAffectionUI(){
  const v = getAffection();
  $('#gAffNum').textContent = v;
  $('#gAffFill').style.width = ((v-1)/99*100) + '%';
  $('#gAffLevel').textContent = getLevelName(v);
}

/** 成就检查 */
function checkAchievements(){
  const v = getAffection();
  const list = DB.achievements.length ? DB.achievements : DEFAULT_ACHIEVEMENTS;
  list.forEach(a=>{
    if (v >= a.unlock && mainSave.achievements.indexOf(a.id) === -1){
      mainSave.achievements.push(a.id);
      toast('🏆 解锁成就：' + a.title, 'ok');
    }
  });
  saveMain();
}

/* ============================================================================
   =========================  PART 6 · 剧情引擎  ==============================
   ============================================================================ */

function findNextChapter(order){
  const list = Object.keys(DB.chapters).map(k=>DB.chapters[k])
                .filter(c=>c && typeof c.order === 'number')
                .sort((a,b)=>a.order-b.order);
  for (let i=0;i<list.length;i++){
    if (list[i].order > order) return list[i];
  }
  return null;
}

function getFirstChapter(){
  const list = Object.keys(DB.chapters).map(k=>DB.chapters[k])
                .filter(c=>c && typeof c.order === 'number')
                .sort((a,b)=>a.order-b.order);
  return list[0] || null;
}

/** 开始新游戏 */
function startNewGame(){
  const first = getFirstChapter();
  if (!first){ toast('剧情库为空，请先在代码工坊导入章节', 'err'); return; }
  if (mainSave.started){
    openModal({
      title:'重新开始？',
      body:'当前已有进度，重新开始会清空好感度、已读记录与剧情进度（内容库与解锁数据保留）。',
      buttons:[
        { text:'取消', cls:'' , act: closeModal },
        { text:'确认重新开始', cls:'btn-primary', act: ()=>{
          const keepAch = mainSave.achievements;
          mainSave = newMainSave();
          mainSave.achievements = keepAch;
          App.seen = mainSave.seen;
          App.history = mainSave.history;
          App.applied = mainSave.applied;
          saveMain();
          closeModal();
          beginChapter(first);
        }}
      ]
    });
    return;
  }
  beginChapter(first);
}

/** 进入某一章 */
function beginChapter(ch){
  App.mode = 'main';
  App.chapter = ch;
  App.beatIndex = 0;
  mainSave.chapterId = ch.id;
  mainSave.beatIndex = 0;
  mainSave.started = true;
  saveMain();
  showPage('page-game');
  renderBeat();
}

/** 继续游戏 */
function continueGame(){
  if (!mainSave.started || !mainSave.chapterId){
    startNewGame();
    return;
  }
  const ch = DB.chapters[mainSave.chapterId];
  if (!ch){
    toast('未找到章节数据：' + mainSave.chapterId, 'err');
    return;
  }
  App.mode = 'main';
  App.chapter = ch;
  App.beatIndex = mainSave.beatIndex || 0;
  App.seen = mainSave.seen;
  App.history = mainSave.history;
  App.applied = mainSave.applied;
  showPage('page-game');
  renderBeat();
}

/** 章节重玩（不影响主进度） */
function replayChapter(id){
  const ch = DB.chapters[id];
  if (!ch) return;
  // 使用临时快照，退出时不写回主进度
  const snapshot = {
    chapterId: mainSave.chapterId,
    beatIndex: mainSave.beatIndex,
    applied: mainSave.applied
  };
  App.mode = 'replay';
  App.chapter = ch;
  App.beatIndex = 0;
  App.applied = {};     // 独立结算
  showPage('page-game');
  renderBeat();
  toast('重玩模式：退出后不会影响主线进度', 'warn');
}

/* ---------------------------------------------------------------------------
   渲染单个 beat
   --------------------------------------------------------------------------- */
function renderBeat(){
  const ch = App.chapter;
  if (!ch) return;
  const beats = ch.beats || [];

  if (App.beatIndex >= beats.length){
    finishChapter();
    return;
  }

  const beat = beats[App.beatIndex];
  App.currentBeat = beat;

  // ---- 好感度结算（每个 beat 只结算一次）----
  if (beat.affection){
    const key = ch.id + '#' + (beat.id != null ? beat.id : App.beatIndex);
    const store = (App.mode === 'side') ? App.appliedSide : App.applied;
    if (!store[key]){
      store[key] = true;
      changeAffection(beat.affection);
    }
  }

  hideChoices();
  hideBubble();

  switch(beat.type){
    case 'narration':
      showText('', beat.text || '', 'narration');
      break;
    case 'dialogue':
      showText(beat.speaker || '', beat.text || '', 'dialogue');
      break;
    case 'inner':
      showText(beat.speaker || '小桁', beat.text || '', 'inner');
      break;
    case 'choice':
      showText('', beat.prompt || '', 'narration');
      showChoices(beat);
      break;
    case 'affection_event':
      showText('', beat.text || '', 'narration');
      break;
    case 'chapter_end':
      finishChapter();
      return;
    default:
      showText('', beat.text || '', 'narration');
  }

  // 写入历史
  if (beat.type === 'narration' || beat.type === 'dialogue' || beat.type === 'inner'){
    pushHistory({
      type: beat.type,
      speaker: beat.speaker || '',
      text: beat.text || ''
    });
  }

  updateAffectionUI();
}

/** 显示文本（带打字机） */
function showText(speaker, text, kind){
  const box = $('#gBox');
  const tag = $('#gSpeaker');
  const txt = $('#gText');
  const hint = $('#gHint');

  box.className = 'dialogue-box ' + (kind || 'narration');
  hint.classList.remove('show');

  if (speaker){
    tag.style.display = '';
    tag.textContent = speaker;
  } else {
    tag.style.display = 'none';
  }

  clearInterval(App.typeTimer);
  txt.textContent = '';

  const cfg = DB.config;
  const speed = (cfg.typewriter === false) ? 0 : (cfg.speed || 28);

  if (App.skipMode || speed <= 0){
    txt.textContent = text;
    App.typing = false;
    hint.classList.add('show');
    scheduleAuto();
    return;
  }

  App.typing = true;
  let i = 0;
  App.typeTimer = setInterval(function(){
    txt.textContent += text.charAt(i);
    i++;
    if (i >= text.length){
      clearInterval(App.typeTimer);
      App.typing = false;
      hint.classList.add('show');
      scheduleAuto();
    }
  }, speed);
}

/** 立刻结束打字 */
function finishTyping(){
  if (!App.typing) return false;
  clearInterval(App.typeTimer);
  App.typing = false;
  const beat = App.currentBeat;
  if (beat) $('#gText').textContent = beat.text || beat.prompt || '';
  $('#gHint').classList.add('show');
  return true;
}

/** 显示选项 */
function showChoices(beat){
  const wrap = $('#gChoices');
  wrap.innerHTML = '';
  const opts = beat.options || [];
  let shown = 0;

  opts.forEach(function(opt){
    // 条件可见性
    if (opt.require && typeof opt.require.affectionMin === 'number'){
      if (getAffection() < opt.require.affectionMin) return;
    }
    shown++;
    const b = document.createElement('button');
    b.className = 'choice-btn';
    b.textContent = opt.text || '……';
    b.addEventListener('click', function(e){
      e.stopPropagation();
      pickChoice(opt);
    });
    wrap.appendChild(b);
  });

  if (shown === 0){
    // 兜底：所有选项都被条件挡掉时，直接推进
    const b = document.createElement('button');
    b.className = 'choice-btn';
    b.textContent = '（继续）';
    b.addEventListener('click', function(e){ e.stopPropagation(); advance(); });
    wrap.appendChild(b);
  }

  wrap.classList.add('show');
}

function hideChoices(){
  $('#gChoices').classList.remove('show');
  $('#gChoices').innerHTML = '';
}

/** 选择处理 */
function pickChoice(opt){
  hideChoices();
  markSeen();
  if (opt.affection) changeAffection(opt.affection);

  if (opt.next){
    const idx = (App.chapter.beats || []).findIndex(b => b.id === opt.next);
    if (idx >= 0){
      App.beatIndex = idx;
      saveProgress();
      renderBeat();
      return;
    }
  }
  advance();
}

/** 标记当前 beat 为已读 */
function markSeen(){
  const beat = App.currentBeat;
  if (!beat || !App.chapter) return;
  if (beat.id != null){
    App.seen[App.chapter.id + ':' + beat.id] = true;
  }
}

/** 推进到下一个 beat */
function advance(){
  const ch = App.chapter;
  if (!ch) return;
  const beats = ch.beats || [];
  const beat = beats[App.beatIndex];

  markSeen();

  let ni = App.beatIndex + 1;
  if (beat && beat.next){
    const idx = beats.findIndex(b => b.id === beat.next);
    if (idx >= 0) ni = idx;
  }

  App.beatIndex = ni;
  saveProgress();
  renderBeat();
}

/** 章节结束 */
function finishChapter(){
  const ch = App.chapter;
  if (!ch) return;

  if (App.mode === 'side'){
    // 副本结束
    if (App.sideId){
      store.set(sideSaveKey(App.sideId), {
        beatIndex: 0,
        applied: App.appliedSide,
        finished: true,
        updated: Date.now()
      });
    }
    openModal({
      title:'副本结束',
      body:'「' + esc(ch.title) + '」已完成。\n副本进度不会影响主线。',
      buttons:[
        { text:'返回副本列表', cls:'btn-primary', act: function(){
          closeModal(); exitToSideList();
        }}
      ]
    });
    return;
  }

  if (App.mode === 'replay'){
    openModal({
      title:'重玩结束',
      body:'本章重玩完毕。主线进度未发生改变。',
      buttons:[
        { text:'返回主页', cls:'btn-primary', act: function(){ closeModal(); exitToHome(); }}
      ]
    });
    return;
  }

  // 主线
  const next = findNextChapter(ch.order);

  if (next){
    openModal({
      title:'本章完 · ' + esc(ch.title),
      body:'下一章已就绪：<br><b>' + esc(next.title) + '</b>',
      buttons:[
        { text:'稍后再说', cls:'', act: function(){
          closeModal(); exitToHome();
        }},
        { text:'进入下一章', cls:'btn-primary', act: function(){
          closeModal();
          beginChapter(next);
        }}
      ]
    });
  } else {
    openModal({
      title:'本章完 · ' + esc(ch.title),
      body:'目前还没有后续章节。<br>你可以打开<b>代码工坊</b>，导入新的章节 JSON，然后回到主页点击「继续剧情」即可无缝接续。',
      buttons:[
        { text:'打开代码工坊', cls:'', act: function(){
          closeModal(); showPage('page-workshop'); renderWorkshop();
        }},
        { text:'返回主页', cls:'btn-primary', act: function(){
          closeModal(); exitToHome();
        }}
      ]
    });
  }
}

/* ---------------------------------------------------------------------------
   历史记录
   --------------------------------------------------------------------------- */
function pushHistory(item){
  App.history.push(item);
  if (App.history.length > 400) App.history.shift();
  if (App.mode === 'main') saveMain();
}

/* ---------------------------------------------------------------------------
   自动播放 / 跳过
   --------------------------------------------------------------------------- */
function scheduleAuto(){
  clearTimeout(App.autoTimer);
  if (!App.autoMode) return;
  const beat = App.currentBeat;
  if (!beat) return;
  if (beat.type === 'choice' || beat.type === 'chapter_end') return;
  App.autoTimer = setTimeout(function(){
    if (App.autoMode) advance();
  }, 1400);
}

function toggleAuto(){
  App.autoMode = !App.autoMode;
  $('#gBtnAuto').classList.toggle('on', App.autoMode);
  if (App.autoMode){
    App.skipMode = false;
    $('#gBtnSkip').classList.remove('on');
    toast('自动播放：开');
    if (!App.typing) scheduleAuto();
  } else {
    toast('自动播放：关');
    clearTimeout(App.autoTimer);
  }
}

function toggleSkip(){
  App.skipMode = !App.skipMode;
  $('#gBtnSkip').classList.toggle('on', App.skipMode);
  if (App.skipMode){
    App.autoMode = false;
    $('#gBtnAuto').classList.remove('on');
    toast('跳过已读：开（仅跳过已读内容）');
    runSkip();
  } else {
    toast('跳过已读：关');
  }
}

/** 跳过循环：仅跳过已读的 beat */
function runSkip(){
  if (!App.skipMode) return;
  const ch = App.chapter;
  if (!ch) return;
  const beat = (ch.beats||[])[App.beatIndex];
  if (!beat) return;

  if (beat.type === 'choice' || beat.type === 'chapter_end'){
    App.skipMode = false;
    $('#gBtnSkip').classList.remove('on');
    return;
  }

  const isSeen = App.seen[ch.id + ':' + beat.id];
  if (!isSeen){
    App.skipMode = false;
    $('#gBtnSkip').classList.remove('on');
    toast('已跳到未读内容');
    return;
  }

  advance();
  setTimeout(runSkip, 60);
}

/* ============================================================================
   =========================  PART 7 · 彩蛋副本  ==============================
   ============================================================================ */

function sideUnlocked(side){
  const u = side.unlock;
  if (!u) return true;
  if (typeof u.affectionMin === 'number' && getAffection() < u.affectionMin) return false;
  if (u.chapterId){
    const idx = String(u.chapterId);
    const done = Object.keys(App.seen || {}).some(k => k.indexOf(idx + ':') === 0);
    if (!done) return false;
  }
  return true;
}

function playSide(id){
  const side = DB.sides[id];
  if (!side){ toast('副本不存在', 'err'); return; }
  if (!sideUnlocked(side)){ toast('尚未解锁该副本', 'warn'); return; }

  const save = store.get(sideSaveKey(id), null);

  App.mode = 'side';
  App.sideId = id;
  App.chapter = side;
  App.beatIndex = (save && typeof save.beatIndex === 'number') ? save.beatIndex : 0;
  App.appliedSide = (save && save.applied) ? save.applied : {};

  if (App.beatIndex >= (side.beats||[]).length) App.beatIndex = 0;

  showPage('page-game');
  renderBeat();
}

function exitToSideList(){
  App.mode = 'main';
  App.sideId = null;
  App.chapter = null;
  showPage('page-side');
  renderSides();
}

function showPage(id){

  pages.forEach(function(p){
    p.classList.remove('active');

/* ---------------------------------------------------------------------------
   Q&A 页面
   --------------------------------------------------------------------------- */
function renderQna(){
  const all = Object.keys(DB.qna).map(k => DB.qna[k]);
  // 分类
  const cats = ['全部'];
  all.forEach(function(q){
    const c = q.category || '未分类';
    if (cats.indexOf(c) === -1) cats.push(c);
  });

  const tabs = $('#qnaTabs');
  tabs.innerHTML = '';
  cats.forEach(function(c){
    const b = document.createElement('button');
    b.className = 'tab' + (App.qnaFilter === c ? ' active' : '');
    b.textContent = c;
    b.onclick = function(){ App.qnaFilter = c; renderQna(); };
    tabs.appendChild(b);
  });

  const kw = ($('#qnaSearch').value || '').trim().toLowerCase();
  const aff = getAffection();

  const list = all
    .filter(q => App.qnaFilter === '全部' || (q.category||'未分类') === App.qnaFilter)
    .filter(function(q){
      if (!kw) return true;
      const s = ((q.question||'') + (q.answer||'') + (q.category||'')).toLowerCase();
      return s.indexOf(kw) >= 0;
    })
    .sort(function(a,b){ return (a.unlock||0) - (b.unlock||0); });

  const wrap = $('#qnaList');
  wrap.innerHTML = '';

  if (!list.length){
    wrap.innerHTML = '<div class="empty-tip" style="grid-column:1/-1"><span class="big">🦊</span>这里还空着。<br>去代码工坊导入 Q&A 吧。</div>';
    return;
  }

  list.forEach(function(q){
    const unlocked = aff >= (q.unlock || 0);
    const card = document.createElement('div');
    card.className = 'card' + (unlocked ? ' clickable' : ' locked');

    let html =
      '<div class="card-head">' +
        '<div class="card-title">' + esc(q.question || '（无题）') + '</div>' +
        '<div class="card-cat">' + esc(q.category || '未分类') + '</div>' +
      '</div>';

    if (!unlocked){
      html += '<div class="card-lock">🔒 好感度 ' + (q.unlock||0) + ' 解锁（当前 ' + aff + '）</div>';
    } else {
      html += '<div class="card-lock" style="color:var(--cash)">🔓 已解锁 · 点击查看回答</div>';
      html += '<div class="card-answer" style="display:none">' +
                '<span class="ans-label">CASH SAYS</span>' +
                esc(q.answer || '……').replace(/\n/g,'<br>') +
              '</div>';
    }

    card.innerHTML = html;

    if (unlocked){
      card.onclick = function(){
        const a = $('.card-answer', card);
        if (!a) return;
        const open = a.style.display !== 'none';
        a.style.display = open ? 'none' : 'block';
      };
    }
    wrap.appendChild(card);
  });
}

/* ---------------------------------------------------------------------------
   角色信息页面
   --------------------------------------------------------------------------- */
function renderInfo(){
  const body = $('#infoBody');
  const aff = getAffection();

  // 标签状态
  $$('#infoTabs .tab').forEach(function(t){
    t.classList.toggle('active', t.dataset.itab === App.infoTab);
  });

  // ---- 成就 ----
  if (App.infoTab === 'ach'){
    const list = DB.achievements.length ? DB.achievements : DEFAULT_ACHIEVEMENTS;

    list.sort((a,b)=>a.unlock-b.unlock).forEach(function(a){
      const got = (mainSave.achievements || []).indexOf(a.id) >= 0;
      h += '<div class="ach-item' + (got ? '' : ' locked') + '">' +
             '<div class="ach-icon">' + (got ? (a.icon||'🏆') : '🔒') + '</div>' +
             '<div><div class="ach-t">' + esc(a.title) + '</div>' +
             '<div class="ach-d">' + esc(a.desc) + '</div></div>' +
           '</div>';
    });
    body.innerHTML = h || '<div class="empty-tip">暂无成就</div>';
    return;
  }

  // ---- 人际关系 ----
  if (App.infoTab === 'rel'){
    const list = Object.keys(DB.relations).map(k=>DB.relations[k])
                  .sort((a,b)=>(a.unlock||0)-(b.unlock||0));

               '<div class="avatar">🔒</div>' +

        h += '<div class="rel-node">' +
               '<div class="avatar">' + esc((r.name||'?').charAt(0)) + '</div>' +
               '<div class="rname">' + esc(r.name) + '</div>' +
               '<div class="rrole">' + esc(r.role||'') + '</div>' +

      }
    });
    h += '</div>';
    body.innerHTML = h;
    return;
  }

  // ---- 卡什档案 / 卡什的东西 / 我的信息 ----
  let target = 'cash';
  let group = '档案';
  if (App.infoTab === 'items'){ target = 'cash'; group = 'item'; }
  if (App.infoTab === 'mott'){  target = 'mott'; group = '档案'; }

  const list = Object.keys(DB.charinfo).map(k=>DB.charinfo[k])
                .filter(function(c){
                  if (c.target !== target) return false;
                  const g = c.group || '档案';
                  return g === group;
                })
                .sort((a,b)=>(a.unlock||0)-(b.unlock||0));

  if (!list.length){
    const tips = {
      cash:'卡什的档案还空着。去代码工坊导入 charinfo（target: "cash"）吧。',
      items:'卡什的小物件还没收集。导入 charinfo（target:"cash", group:"item"）吧。',
      mott:'你的档案是空白的。<br>去代码工坊导入 charinfo（target: "mott"）来补全自己。'
    };
    body.innerHTML = '<div class="empty-tip"><span class="big">📄</span>' + (tips[App.infoTab] || '暂无数据') + '</div>';
    return;
  }

  let h = '<div class="card-grid">';
  list.forEach(function(c){
    const ok = aff >= (c.unlock||0);
    h += '<div class="card' + (ok ? '' : ' locked') + '">' +
           '<div class="card-head">' +
             '<div class="card-title">' + esc(c.title || '未命名') + '</div>' +
             '<div class="card-cat">' + (ok ? '已解锁' : '🔒') + '</div>' +
           '</div>';
    if (ok){
      h += '<div class="card-desc">' + esc(c.content||'').replace(/\n/g,'<br>') + '</div>';
    } else {
      h += '<div class="card-lock">🔒 好感度 ' + (c.unlock||0) + ' 解锁（当前 ' + aff + '）</div>';
    }
    h += '</div>';
  });
  h += '</div>';
  body.innerHTML = h;
}

/* ---------------------------- 校验器 ---------------------------- */
const VALIDATORS = {
  chapter: function(d){
    const e = [];
    if (!d.id) e.push('缺少字段 id');
    if (!d.title) e.push('缺少字段 title');
    if (typeof d.order !== 'number') e.push('缺少字段 order（必须是数字）');
    if (!Array.isArray(d.beats)) e.push('缺少字段 beats（必须是数组）');
    else {
      d.beats.forEach(function(b, i){
        if (!b || typeof b !== 'object'){ e.push('beats[' + i + '] 不是对象'); return; }
        if (!b.type) e.push('beats[' + i + '] 缺少 type');
        if (b.type === 'choice' && !Array.isArray(b.options)) e.push('beats[' + i + '] 是 choice 但缺少 options 数组');
      });
    }
    return e;
  },
  qna: function(d){
    const e = [];
    if (!d.id) e.push('缺少字段 id');
    if (!d.question) e.push('缺少字段 question');
    if (d.answer == null) e.push('缺少字段 answer');
    if (d.unlock != null && typeof d.unlock !== 'number') e.push('unlock 必须是数字');
    return e;
  },
  charinfo: function(d){
    const e = [];
    if (!d.id) e.push('缺少字段 id');
    if (!d.target) e.push('缺少字段 target（"cash" 或 "mott"）');
    if (!d.title) e.push('缺少字段 title');
    if (d.content == null) e.push('缺少字段 content');
    if (d.unlock != null && typeof d.unlock !== 'number') e.push('unlock 必须是数字');
    return e;
  },
  relation: function(d){
    const e = [];
    if (!d.id) e.push('缺少字段 id');
    if (!d.name) e.push('缺少字段 name');
    if (d.unlock != null && typeof d.unlock !== 'number') e.push('unlock 必须是数字');
    return e;
  },
  side: function(d){
    const e = [];
    if (!d.id) e.push('缺少字段 id');
    if (!d.title) e.push('缺少字段 title');
    if (!Array.isArray(d.beats)) e.push('缺少字段 beats（必须是数组）');
    else {
      d.beats.forEach(function(b, i){
        if (!b || !b.type) e.push('beats[' + i + '] 缺少 type');
      });
    }
    return e;
  },
  affection_levels: function(d){
    const e = [];
    if (!Array.isArray(d.levels)) e.push('缺少字段 levels（必须是数组）');
    else {
      d.levels.forEach(function(l, i){
        if (typeof l.min !== 'number') e.push('levels[' + i + '] 缺少 min');
        if (typeof l.max !== 'number') e.push('levels[' + i + '] 缺少 max');
        if (!l.name) e.push('levels[' + i + '] 缺少 name');
      });
    }
    return e;
  }
};

/* ---------------------------- 导入逻辑 ---------------------------- */
function importJSON(type, rawText){
  let parsed;
  try{
    parsed = JSON.parse(rawText);
  }catch(err){
    return { ok:false, errors:['JSON 解析失败：' + err.message] };
  }

  const items = Array.isArray(parsed) ? parsed : [parsed];
  if (!items.length) return { ok:false, errors:['内容为空'] };

  // 特殊类型：affection_levels（整体替换）
  if (type === 'affection_levels'){
    const errs = VALIDATORS.affection_levels(parsed.levels ? parsed : items[0]);
    if (errs.length) return { ok:false, errors:errs };
    const target = parsed.levels ? parsed : items[0];
    store.set(K.levels, { type:'affection_levels', levels: target.levels });
    DB.levels = target.levels;
    return { ok:true, added:0, updated:1, msg:'好感度等级表已整体覆盖（' + target.levels.length + ' 级）' };
  }

  const validator = VALIDATORS[type];
  const allErrors = [];
  const validItems = [];

  items.forEach(function(it, idx){
    if (!it || typeof it !== 'object'){
      allErrors.push('第 ' + (idx+1) + ' 条不是对象');
      return;
    }
    // 若 item 未带 type，按当前类型补齐
    if (!it.type) it.type = type;
    const errs = validator(it);
    if (errs.length){
      errs.forEach(function(e){ allErrors.push('第 ' + (idx+1) + ' 条：' + e); });
    } else {
      validItems.push(it);
    }
  });

  if (allErrors.length){
    return { ok:false, errors: allErrors };
  }

  const t = WS_TYPES.filter(function(x){ return x.key === type; })[0];
  const bucket = DB[t.storeKey];
  let added = 0, updated = 0;
  const names = [];

  validItems.forEach(function(it){
    if (bucket[it.id]) updated++; else added++;
    bucket[it.id] = it;
    names.push(it.title || it.question || it.name || it.id);
  });

  store.set(K[t.storeKey], bucket);

  // 导入后立即刷新 UI（无需改引擎代码）
  if (type === 'chapter') renderHome();
  if (type === 'qna') renderQna();

  return {
    ok:true,
    added:added,
    updated:updated,
    msg:'已导入 ' + validItems.length + ' 条：新增 ' + added + '，覆盖更新 ' + updated +
        '（' + names.slice(0,3).join('、') + (names.length>3 ? ' 等' : '') + '）'
  };
}

function openModal(opt){

    });

  }
  box.innerHTML = h;

  $$('[data-close]', box).forEach(function(b){ b.onclick = closeModal; });

    if (el.classList.contains('switch')){
      el.onclick = function(){
        cfg[key] = !cfg[key];
        el.classList.toggle('on', cfg[key]);
        applyConfig();
        store.set(K.config, cfg);
      };
    } else {
      el.oninput = function(){
        cfg[key] = parseFloat(el.value);
        applyConfig();
        store.set(K.config, cfg);
      };
    }
  });

  const rst = $('#setResetSave', box);
  if (rst){
    rst.onclick = function(){
      openModal({
        title:'重置主线存档？',
        body:'将清空好感度、剧情进度、已读记录与历史。<br>内容库（章节/Q&A/档案）与成就保留。',
        buttons:[
          { text:'取消', act: closeModal },
          { text:'确认重置', cls:'btn-primary', act: function(){
            mainSave = newMainSave();
            App.seen = mainSave.seen;
            App.history = mainSave.history;
            App.applied = mainSave.applied;
            saveMain();
            closeModal();
            renderHome();
            toast('主线存档已重置', 'ok');
          }}
        ]
      });
    };
  }
}

/* --------------------------- 每日一签 --------------------------- */
function checkDaily(){
  const today = dateKey();
  const last = store.get(K.daily, null);
  if (last && last.date === today) return;

  store.set(K.daily, { date: today, ts: Date.now() });

  // 从未开始过游戏的玩家不弹
  if (!mainSave.started) return;

  setTimeout(function(){
    const aff = getAffection();
    // 优先从已解锁的 Q&A 中挑
    const pool = Object.keys(DB.qna).map(k => DB.qna[k])
                   .filter(q => aff >= (q.unlock||0));
    let line;
    if (pool.length){
      const pick = pool[Math.floor(Math.random() * pool.length)];
      line = pick.answer;
    } else {
      const fallback = [
        '「Morning. 咖啡呢？」',
        '「喂，你昨天是不是又熬夜了。黑眼圈比我还重。」',
        '「今天去哪？带我。反正我也没事干。」',
        '「你做的那个……那个红色的东西，还有吗？」',
        '「Listen. 我认真的：你的翻译水平，值一顿饭。」'
      ];
      line = fallback[Math.floor(Math.random() * fallback.length)];
    }

    openModal({
      title:'今日随谈 · ' + today,
      body:'<div style="font-size:.78rem;letter-spacing:.2em;color:var(--cash);font-family:var(--font-sans);margin-bottom:10px">CASH SAYS</div>' +
           '<div style="line-height:2">' + esc(line).replace(/\n/g,'<br>') + '</div>' +
           '<div style="margin-top:16px;font-size:.72rem;color:var(--ink-faint);font-family:var(--font-sans)">' +
             '当前好感度 ' + aff + ' · ' + esc(getLevelName(aff)) +

  }, 900);
}

function hideBubble(){
  $('#gBubble').classList.remove('show');
}

function touchPortrait(){
  const aff = getAffection();
  let pool;
  if (aff >= 90) pool = TOUCH_LINES.max;
  else if (aff >= 60) pool = TOUCH_LINES.high;
  else if (aff >= 30) pool = TOUCH_LINES.mid;
  else pool = TOUCH_LINES.low;

  const line = pool[Math.floor(Math.random() * pool.length)];
  const bubble = $('#gBubble');
  bubble.textContent = line;
  bubble.classList.add('show');

  const p = $('#gPortrait');
  p.classList.remove('pop');
  void p.offsetWidth;
  p.classList.add('pop');

  clearTimeout(touchPortrait._t);
  touchPortrait._t = setTimeout(hideBubble, 2600);
}

/* --------------------------- 剧情搜索 --------------------------- */
function globalSearch(kw){
  kw = (kw||'').trim().toLowerCase();
  if (!kw) return [];
  const res = [];
  const aff = getAffection();

  Object.keys(DB.qna).forEach(function(k){
    const q = DB.qna[k];
    if (aff < (q.unlock||0)) return;
    const s = ((q.question||'') + (q.answer||'')).toLowerCase();
    if (s.indexOf(kw) >= 0) res.push({ kind:'Q&A', title:q.question, text:q.answer });
  });

  Object.keys(DB.charinfo).forEach(function(k){
    const c = DB.charinfo[k];
    if (aff < (c.unlock||0)) return;
    const s = ((c.title||'') + (c.content||'')).toLowerCase();
    if (s.indexOf(kw) >= 0) res.push({ kind:'档案', title:c.title, text:c.content });
  });

  (App.history||[]).forEach(function(h){
    if (String(h.text||'').toLowerCase().indexOf(kw) >= 0){
      res.push({ kind:'对白', title:h.speaker || '旁白', text:h.text });
    }
  });

  return res.slice(0, 60);
}

/* ============================================================================
   =========================  PART 12 · 导入导出  =============================
   ============================================================================ */

function importFullPack(pack, mode){
  // mode: 'merge' | 'replace'
  if (!pack || pack.format !== 'HZY_EXPORT' && pack.format !== 'HZY_CONTENT'){
    if (!pack.data) return { ok:false, msg:'不是有效的 HZY 导出文件' };
  }

  const d = pack.data || {};

  if (mode === 'replace'){
    DB.chapters  = d.chapters  || {};
    DB.qna       = d.qna       || {};
    DB.charinfo  = d.charinfo  || {};
    DB.relations = d.relations || {};
    DB.sides     = d.sides     || {};
    DB.levels    = (d.levels && d.levels.length) ? d.levels : DEFAULT_LEVELS.slice();
  } else {
    // 合并：同 id 覆盖
    ['chapters','qna','charinfo','relations','sides'].forEach(function(key){
      if (!d[key]) return;
      Object.keys(d[key]).forEach(function(id){ DB[key][id] = d[key][id]; });
    });
    if (d.levels && d.levels.length) DB.levels = d.levels;
  }

  store.set(K.chapters, DB.chapters);
  store.set(K.qna, DB.qna);
  store.set(K.charinfo, DB.charinfo);
  store.set(K.relations, DB.relations);
  store.set(K.sides, DB.sides);
  store.set(K.levels, { type:'affection_levels', levels: DB.levels });

  // 存档（仅完整导出包含）
  if (pack.save && pack.format === 'HZY_EXPORT'){
    mainSave = Object.assign(newMainSave(), pack.save);
    App.seen = mainSave.seen;
    App.history = mainSave.history;
    App.applied = mainSave.applied;
    saveMain();
  }

  if (pack.slots && Array.isArray(pack.slots)){
    pack.slots.forEach(function(s, i){
      if (s && K.slots[i]) store.set(K.slots[i], s);
    });
  }

  if (pack.config){
    DB.config = Object.assign({}, DEFAULT_CONFIG, pack.config);
    store.set(K.config, DB.config);
    applyConfig();
  }

  renderHome();
  return { ok:true, msg:'导入完成' };
}

function openImportModal(){
  let h = '<div class="modal-head"><span>导入</span><button class="icon-btn" data-close>✕</button></div>';
  h += '<div class="modal-body">' +
         '<p style="margin-bottom:14px;font-size:.84rem;color:var(--ink-soft)">' +
           '可以导入别人分享的完整包（含剧情库 + 存档），也可以导入纯内容库。' +
         '</p>' +
         '<button class="btn sm" id="impFile" style="width:100%;margin-bottom:10px">📁 选择 JSON 文件</button>' +
         '<div class="ws-label" style="margin-top:16px">或直接粘贴 JSON</div>' +
         '<textarea class="ws-textarea" id="impText" style="min-height:140px" placeholder="粘贴导出的 JSON…"></textarea>' +
         '<div class="ws-actions">' +
           '<button class="btn sm btn-primary" id="impMerge">合并导入</button>' +
           '<button class="btn sm" id="impReplace">覆盖导入</button>' +
         '</div>' +
       '</div>';

  openModal({ title:'', body:'' });
  const box = $('#modalBox');
  box.innerHTML = h;
  $$('[data-close]', box).forEach(b => b.onclick = closeModal);

  $('#impFile', box).onclick = function(){
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = '.json,application/json';
    inp.onchange = function(){
      const f = inp.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = function(){ $('#impText', box).value = r.result; toast('文件已载入', 'ok'); };
      r.readAsText(f, 'utf-8');
    };
    inp.click();
  };

  function doImport(mode){
    const txt = $('#impText', box).value.trim();
    if (!txt){ toast('请输入或载入 JSON', 'warn'); return; }
    let pack;
    try{ pack = JSON.parse(txt); }
    catch(e){ toast('JSON 解析失败：' + e.message, 'err'); return; }

    const res = importFullPack(pack, mode);
    if (res.ok){
      closeModal();
      toast('导入成功', 'ok');
      renderHome();
    } else {
      toast(res.msg, 'err');
    }
  }

  $('#impMerge', box).onclick = function(){ doImport('merge'); };
  $('#impReplace', box).onclick = function(){ doImport('replace'); };
}

function applyConfig(){
  const cfg = DB.config;
  document.documentElement.setAttribute('data-theme', cfg.dark ? 'dark' : 'light');
  document.documentElement.style.setProperty('--fs', cfg.fontScale || 1);
  document.body.classList.toggle('crt', !!cfg.crt);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', cfg.dark ? '#1C1917' : '#FFFBF2');
}

/* ============================================================================
   =========================  PART 14 · 数据完整性检测  =======================
   ============================================================================ */
function checkIntegrity(){
  const issues = [];
  const aff = getAffection();

  Object.keys(DB.chapters).forEach(function(k){
    const c = DB.chapters[k];
    if (!c.beats || !c.beats.length) issues.push('章节「' + (c.title||k) + '」缺少 beats');
    else if (typeof c.order !== 'number') issues.push('章节「' + (c.title||k) + '」缺少 order');
  });

  Object.keys(DB.qna).forEach(function(k){
    const q = DB.qna[k];
    if (!q.question || q.answer == null) issues.push('Q&A「' + k + '」字段不完整');
  });

  Object.keys(DB.charinfo).forEach(function(k){
    const c = DB.charinfo[k];
    if (!c.title || c.content == null) issues.push('档案「' + k + '」字段不完整');
  });

  Object.keys(DB.sides).forEach(function(k){
    const s = DB.sides[k];
    if (!s.beats || !s.beats.length) issues.push('副本「' + (s.title||k) + '」缺少 beats');
  });

  if (!DB.levels.length) issues.push('好感度等级表为空');

  const banner = $('#integrityBanner');
  if (issues.length){
    banner.innerHTML =
      '<div class="integrity-banner">' +
        '⚠ 检测到 ' + issues.length + ' 处数据问题：<br>' +
        issues.slice(0,3).map(function(s){ return '· ' + esc(s); }).join('<br>') +
        (issues.length > 3 ? '<br>· …还有 ' + (issues.length-3) + ' 条' : '') +
        '<br><span style="opacity:.75">请前往「代码工坊」重新导入修正。</span>' +
      '</div>';
  } else {
    banner.innerHTML = '';
  }
}

function bindEvents(){

  /* ---------- 主页 ---------- */
  $('#btnStart').onclick      = startNewGame;
  $('#btnContinue').onclick   = continueGame;
  $('#btnQna').onclick        = function(){ showPage('page-qna'); };

  $('#btnShare').onclick      = openShareModal;
  $('#btnImport').onclick     = openImportModal;
  $('#btnSettings').onclick   = openSettingsModal;

  /* ---------- 返回按钮（通用） ---------- */
  $$('[data-back]').forEach(function(b){
    b.onclick = function(){
      if (App.mode === 'side'){ exitToSideList(); return; }
      exitToHome();
    };
  });

  /* ---------- 游戏页 ---------- */
  $('#gBtnBack').onclick = function(){
    if (App.mode === 'side'){
      openModal({
        title:'退出副本？',
        body:'副本进度已自动保存，退出不会影响主线。',
        buttons:[
          { text:'继续游玩', act: closeModal },
          { text:'退出副本', cls:'btn-primary', act: function(){ closeModal(); exitToSideList(); }}
        ]
      });
      return;
    }
    if (App.mode === 'replay'){
      App.mode = 'main';
      exitToHome();
      return;
    }
    saveProgress();
    exitToHome();
  };

  $('#gBtnSettings').onclick = openSettingsModal;
  $('#gBtnHistory').onclick  = openHistoryModal;
  $('#gBtnAuto').onclick     = toggleAuto;
  $('#gBtnSkip').onclick     = toggleSkip;
  $('#gBtnSave').onclick     = openSlotsModal;

  // 点击对话框推进
  $('#gBox').addEventListener('click', function(){
    const beat = App.currentBeat;
    if (!beat) return;
    if (beat.type === 'choice') return;      // 选项由按钮接管
    if (beat.type === 'chapter_end') return;

    if (finishTyping()) return;              // 第一次点击：跳过打字
    if (App.skipMode) return;
    advance();
  });

  // 点击舞台空白推进
  $('#gameStage').addEventListener('click', function(e){
    if (e.target.closest('.choices')) return;
    if (e.target.closest('.portrait-zone')) return;
    if (e.target.closest('#gBox')) return;
    const beat = App.currentBeat;
    if (!beat) return;
    if (beat.type === 'choice' || beat.type === 'chapter_end') return;
    if (finishTyping()) return;
    if (App.skipMode) return;
    advance();
  });

  // 触摸互动
  $('#gPortrait').addEventListener('click', function(e){
    e.stopPropagation();
    touchPortrait();
  });

  /* ---------- Q&A 搜索 ---------- */
  $('#qnaSearch').addEventListener('input', function(){
    if (App.page === 'page-qna') renderQna();
  });

  /* ---------- 角色档案标签 ---------- */
  $$('#infoTabs .tab').forEach(function(t){
    t.onclick = function(){
      App.infoTab = t.dataset.itab;
      renderInfo();
    };
  });

  /* ---------- 模态框背景关闭 ---------- */
  $('#modalWrap').addEventListener('click', function(e){
    if (e.target === $('#modalWrap')) closeModal();
  });

  /* ---------- 键盘 ---------- */
  document.addEventListener('keydown', function(e){
    if (App.page !== 'page-game') return;
    if (e.key === ' ' || e.key === 'Enter'){
      e.preventDefault();
      const beat = App.currentBeat;
      if (!beat || beat.type === 'choice' || beat.type === 'chapter_end') return;
      if (finishTyping()) return;
      advance();
    }
    if (e.key === 'Escape'){
      if ($('#modalWrap').classList.contains('show')) closeModal();
    }
  });
}

/* ============================================================================
   =========================  PART 16 · 初始化  ===============================
   ============================================================================ */
function loadDB(){
  /* --- 读取各内容库；首次运行时注入默认数据 --- */
  let chapters = store.get(K.chapters, null);
  if (!chapters || typeof chapters !== 'object'){
    chapters = {};
    chapters[DEFAULT_CH01.id] = DEFAULT_CH01;
    store.set(K.chapters, chapters);
  }
  DB.chapters = chapters;

  let qna = store.get(K.qna, null);
  if (!qna || typeof qna !== 'object'){
    qna = {};
    DEFAULT_QNA.forEach(function(q){ qna[q.id] = q; });
    store.set(K.qna, qna);
  }
  DB.qna = qna;

  let charinfo = store.get(K.charinfo, null);
  if (!charinfo || typeof charinfo !== 'object'){
    charinfo = {};
    DEFAULT_CHARINFO.forEach(function(c){ charinfo[c.id] = c; });
    store.set(K.charinfo, charinfo);
  }
  DB.charinfo = charinfo;

  let relations = store.get(K.relations, null);
  if (!relations || typeof relations !== 'object'){
    relations = {};
    DEFAULT_RELATIONS.forEach(function(r){ relations[r.id] = r; });
    store.set(K.relations, relations);
  }
  DB.relations = relations;

  let sides = store.get(K.sides, null);
  if (!sides || typeof sides !== 'object'){
    sides = {};
    DEFAULT_SIDES.forEach(function(s){ sides[s.id] = s; });
    store.set(K.sides, sides);
  }
  DB.sides = sides;

  const lvPack = store.get(K.levels, null);
  DB.levels = (lvPack && Array.isArray(lvPack.levels) && lvPack.levels.length)
    ? lvPack.levels
    : DEFAULT_LEVELS.slice();

  DB.config = Object.assign({}, DEFAULT_CONFIG, store.get(K.config, {}));
  DB.achievements = store.get(K.achievements, []) || [];
}

function init(){
  loadDB();
  loadMain();
  applyConfig();
  bindEvents();
  bindWorkshop();
  renderHome();
  updateAffectionUI();
  checkIntegrity();
  checkDaily();

  // 自动存档（页面关闭前）
  window.addEventListener('beforeunload', function(){
    if (App.mode === 'main' && App.chapter){
      saveProgress();
    }
  });

  console.log('%c《和室友恋爱的错误示范》引擎已启动','color:#E86A48;font-weight:bold;font-size:14px');
  console.log('内容库：章节 ' + Object.keys(DB.chapters).length +
              ' / Q&A ' + Object.keys(DB.qna).length +
              ' / 档案 ' + Object.keys(DB.charinfo).length +
              ' / 关系 ' + Object.keys(DB.relations).length +
              ' / 副本 ' + Object.keys(DB.sides).length);
}

document.addEventListener('DOMContentLoaded', init);

// 兼容：DOMContentLoaded 已过的情况
if (document.readyState === 'interactive' || document.readyState === 'complete'){
  setTimeout(function(){ if (!window.__hzy_inited){ window.__hzy_inited = true; init(); } }, 0);
} else {
  window.__hzy_inited = true;
}

})();
